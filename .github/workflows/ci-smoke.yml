name: CI Smoke

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build shared client
        run: yarn workspace @linx/client build

      - name: Web build check
        run: yarn workspace @linx/web build:check

      - name: Desktop tests
        run: yarn workspace @linx/desktop test

      - name: Desktop package smoke
        if: matrix.os == 'ubuntu-latest'
        run: yarn workspace @linx/desktop run package:dir

      - name: Mobile shell smoke
        run: yarn workspace @linx/mobile smoke
