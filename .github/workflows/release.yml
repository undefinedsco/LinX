name: Release

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Git ref to build, for example linx-v0.3.1. Defaults to the workflow ref.'
        required: false
        type: string
        default: ''
      release_tag:
        description: 'GitHub release tag to publish assets to. Defaults to release_ref or the workflow ref name.'
        required: false
        type: string
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: Web Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build web shell
        env:
          RELEASE_TAG: ${{ inputs.release_tag || inputs.release_ref || github.ref_name }}
          VITE_RELEASE_REPO: ${{ github.repository }}
        run: |
          release_version="${RELEASE_TAG#refs/tags/}"
          release_version="${release_version#linx-v}"
          release_version="${release_version#v}"
          export VITE_APP_VERSION="$release_version"
          yarn workspace @linx/web build

      - name: Archive web dist
        env:
          RELEASE_TAG: ${{ inputs.release_tag || inputs.release_ref || github.ref_name }}
        run: tar -czf "linx-web-${RELEASE_TAG}.tar.gz" -C apps/web dist

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: linx-web-${{ inputs.release_tag || inputs.release_ref || github.ref_name }}
          path: linx-web-${{ inputs.release_tag || inputs.release_ref || github.ref_name }}.tar.gz

  desktop:
    name: Desktop Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build desktop release artifacts
        env:
          RELEASE_TAG: ${{ inputs.release_tag || inputs.release_ref || github.ref_name }}
          LINX_RELEASE_REPO: ${{ github.repository }}
        shell: bash
        run: |
          release_version="${RELEASE_TAG#refs/tags/}"
          release_version="${release_version#linx-v}"
          release_version="${release_version#v}"
          export LINX_APP_VERSION="$release_version"
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            yarn workspace @linx/desktop run dist:mac:zip -- --config.extraMetadata.version="$LINX_APP_VERSION"
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            yarn workspace @linx/desktop run dist:win -- --config.extraMetadata.version="$LINX_APP_VERSION"
          else
            yarn workspace @linx/desktop run dist:linux:release -- --config.extraMetadata.version="$LINX_APP_VERSION"
          fi

      - name: Collect desktop artifacts
        shell: bash
        run: |
          mkdir -p desktop-release-assets
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            find apps/desktop/release -maxdepth 1 -type f \
              \( -name '*.zip' -o -name '*.blockmap' -o -name 'latest*.yml' \) \
              -exec cp {} desktop-release-assets/ \;
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            find apps/desktop/release -maxdepth 1 -type f \
              \( -name '*.exe' -o -name '*.blockmap' -o -name 'latest*.yml' \) \
              -exec cp {} desktop-release-assets/ \;
          else
            find apps/desktop/release -maxdepth 1 -type f \
              \( -name '*.AppImage' -o -name '*.deb' -o -name '*.blockmap' -o -name 'latest*.yml' \) \
              -exec cp {} desktop-release-assets/ \;
          fi

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: linx-desktop-${{ matrix.os }}-${{ inputs.release_tag || inputs.release_ref || github.ref_name }}
          path: desktop-release-assets

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - web
      - desktop
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten artifacts
        run: find release-assets -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.blockmap' -o -name 'latest*.yml' \) -exec cp {} . \;

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || inputs.release_ref || github.ref_name }}
          files: |
            *.tar.gz
            *.zip
            *.exe
            *.AppImage
            *.deb
            *.blockmap
            latest*.yml
          generate_release_notes: true
          body: |
            LinX release `${{ inputs.release_tag || inputs.release_ref || github.ref_name }}`

            Included artifacts:
            - Web shell bundle
            - Desktop release artifacts for macOS and Linux

  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs:
      - publish
    if: success()
    steps:
      - name: Send webhook notification
        if: ${{ env.WEBHOOK_URL != '' }}
        env:
          WEBHOOK_URL: ${{ secrets.RELEASE_WEBHOOK_URL }}
        run: |
          release_tag="${{ inputs.release_tag || inputs.release_ref || github.ref_name }}"
          payload=$(printf '{"project":"linx","tag":"%s","releaseUrl":"%s/%s/releases/tag/%s"}' \
            "$release_tag" \
            "${{ github.server_url }}" \
            "${{ github.repository }}" \
            "$release_tag")
          curl -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$payload"
