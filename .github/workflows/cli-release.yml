name: CLI Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm after verification'
        required: true
        type: boolean
        default: false
  push:
    tags:
      - 'linx-v*'

jobs:
  verify:
    name: Verify Release / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build, pack, and smoke
        run: |
          yarn pack:cli:release
          node scripts/smoke-install-cli-release.mjs

      - name: Upload release tarballs
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: cli-release-tarballs
          path: |
            preview/undefineds-co-models-*.tgz
            preview/undefineds-co-linx-*.tgz
          if-no-files-found: error

  publish:
    name: Publish npm
    runs-on: ubuntu-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/linx-v') || github.event.inputs.publish == 'true'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download release tarballs
        uses: actions/download-artifact@v4
        with:
          name: cli-release-tarballs
          path: preview

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Resolve release tarballs
        id: tarballs
        shell: bash
        run: |
          find preview -type f -name '*.tgz' -print
          models_tgz="$(find preview -type f -name 'undefineds-co-models-*.tgz' -print -quit)"
          cli_tgz="$(find preview -type f -name 'undefineds-co-linx-*.tgz' -print -quit)"
          test -n "$models_tgz"
          test -n "$cli_tgz"
          echo "models=./$models_tgz" >> "$GITHUB_OUTPUT"
          echo "cli=./$cli_tgz" >> "$GITHUB_OUTPUT"

      - name: Dry-run publish models
        run: npm publish --access public --dry-run "${{ steps.tarballs.outputs.models }}"

      - name: Dry-run publish CLI
        run: npm publish --access public --dry-run "${{ steps.tarballs.outputs.cli }}"

      - name: Publish models
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public "${{ steps.tarballs.outputs.models }}"

      - name: Publish CLI
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public "${{ steps.tarballs.outputs.cli }}"
