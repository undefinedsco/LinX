name: CLI Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm after verification'
        required: true
        type: boolean
        default: false
  push:
    tags:
      - 'linx-v*'

jobs:
  verify:
    name: Verify Release / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build, pack, and smoke
        run: |
          yarn pack:cli:release
          node scripts/smoke-install-cli-release.mjs

      - name: Upload release tarballs
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: cli-release-tarballs
          path: |
            preview/undefineds-co-linx-*.tgz
          if-no-files-found: error

  publish:
    name: Publish npm
    runs-on: ubuntu-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/linx-v') || github.event.inputs.publish == 'true'
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release tarballs
        uses: actions/download-artifact@v4
        with:
          name: cli-release-tarballs
          path: preview

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Resolve release tarballs
        id: tarballs
        shell: bash
        run: |
          cli_version="$(node -p "require('./apps/cli/package.json').version")"
          cli_tgz="preview/undefineds-co-linx-${cli_version}.tgz"

          find preview -type f -name '*.tgz' -print
          test -f "$cli_tgz"
          echo "cli=./$cli_tgz" >> "$GITHUB_OUTPUT"

      - name: Dry-run publish CLI
        run: npm publish --access public --dry-run "${{ steps.tarballs.outputs.cli }}"

      - name: Publish CLI
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public "${{ steps.tarballs.outputs.cli }}"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/linx-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.tarballs.outputs.cli }}
          generate_release_notes: true
