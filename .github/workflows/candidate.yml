name: Release Candidate

# LinX Web release candidates (docs/RELEASE.md). Every push to `staging` builds one image,
# deploys that exact digest to the shared RC, runs acceptance, and uploads
# `release-acceptance-<sha>` -- the only evidence a stable promotion may use.

on:
  push:
    branches: [staging]
  workflow_dispatch:

# One candidate at a time; a newer push never cancels the candidate occupying RC.
concurrency:
  group: linx-rc-candidate
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_REPO: ghcr.io/undefinedsco/linx-web
  # The provider the RC build points at ("provider=undefineds.co").
  CLOUD_IDENTITY_URL: https://id.undefineds.co

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      candidate: ${{ steps.candidate.outputs.candidate }}
      sourceSha: ${{ steps.candidate.outputs.sourceSha }}
      shaTag: ${{ steps.candidate.outputs.shaTag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve release candidate metadata
        id: candidate
        env:
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          metadata="$(node scripts/release-candidate.mjs --branch "$REF_NAME" --run-number "$RUN_NUMBER" --run-attempt "$RUN_ATTEMPT" --sha "$SOURCE_SHA")"
          echo "$metadata"
          for key in candidate sourceSha shaTag; do
            echo "$key=$(node -e 'console.log(JSON.parse(process.argv[1])[process.argv[2]])' "$metadata" "$key")" >> "$GITHUB_OUTPUT"
          done

  verify:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines
      - name: Build workspace packages
        # Type checking resolves @linx/stores and @linx/agent-runtime through their built
        # output (package.json exports), as `yarn workspace @linx/web build:check` does.
        run: |
          yarn workspace @linx/stores build
          yarn build:agent-runtime
      - name: Type check (web)
        run: cd apps/web && npx tsc --noEmit -p .
      - name: Unit tests (web)
        env:
          LINX_TEST_LOCALSTORAGE_FILE: ${{ runner.temp }}/linx-vitest-localstorage
        run: cd apps/web && yarn -s test run
      - name: Service build and tests
        run: |
          cd apps/service
          npx tsc -p .
          node --test test/*.test.cjs
      - name: Release script tests
        run: node --test scripts/release-candidate.test.mjs scripts/rc-provider-seed.test.mjs scripts/xpod-rc-provider-patch.test.mjs

  # LinX against a real (seeded, SQLite) xpod started from its npm package: sign-in, chat,
  # files, citations, withdrawal, every main surface. Covers the local/standalone space mode
  # that the cloud-only RC cannot.
  local_e2e:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines
      - name: Install Playwright Chromium
        run: cd tests/e2e && npx playwright install --with-deps chromium
      - name: End-to-end against a seeded local xpod
        env:
          CI: '1'
          LINX_E2E_BASE_URL: http://localhost:5199
          LINX_E2E_REUSE_SERVER: '0'
          LINX_E2E_SIGNED_IN_SEEDED: '1'
        run: |
          cd tests/e2e
          npx playwright test --reporter=list \
            specs/solid-auth.spec.ts \
            specs/real-seeded-auth.spec.ts \
            specs/r6-surfaces.spec.ts \
            specs/ask-linx-citation.spec.ts \
            specs/card-withdraw-and-data-folder.spec.ts \
            specs/chat-welcome-history.spec.ts \
            specs/files-table-edit.spec.ts \
            specs/files-kanban-interactions.spec.ts \
            specs/files-card-dialog.spec.ts \
            specs/files-table-undo.spec.ts \
            specs/files-whiteboard.spec.ts \
            specs/deployed-signed-in.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: local-e2e-results-${{ github.sha }}
          path: tests/e2e/test-results
          retention-days: 14

  # LinX against xpod's standalone deployment: the published xpod image in local mode, its
  # own identity provider, a seeded acceptance account (tests/e2e/fixtures/standalone-seed.json).
  standalone_e2e:
    needs: metadata
    runs-on: ubuntu-latest
    env:
      XPOD_IMAGE: ghcr.io/undefinedsco/xpod:${{ vars.XPOD_STANDALONE_TAG || '0.4.30' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - name: Start xpod standalone
        run: |
          set -euo pipefail
          docker run -d --name xpod-standalone -p 5739:5739 \
            -e XPOD_EDITION=local -e CSS_PORT=5739 -e API_PORT=5740 \
            -e CSS_BASE_URL=http://localhost:5739 -e SOLID_OIDC_ISSUER=http://localhost:5739/ \
            -e CSS_ALLOWED_HOSTS=localhost \
            -e XPOD_ENCRYPTION_KEY=linx-ci-standalone-only \
            -e CSS_SPARQL_ENDPOINT=sqlite:/app/data/standalone.sqlite \
            -e CSS_IDENTITY_DB_URL=sqlite:/app/data/standalone-identity.sqlite \
            -e CSS_SEED_CONFIG=/app/config/linx-seed.json \
            -v "$PWD/tests/e2e/fixtures/standalone-seed.json:/app/config/linx-seed.json:ro" \
            "$XPOD_IMAGE"
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines
      - name: Install Playwright Chromium
        run: cd tests/e2e && npx playwright install --with-deps chromium
      - name: Wait for xpod standalone
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:5739/.well-known/openid-configuration; then echo ready; exit 0; fi
            sleep 5
          done
          docker logs --tail 200 xpod-standalone
          exit 1
      - name: Signed-in end-to-end against standalone
        env:
          CI: '1'
          LINX_E2E_BASE_URL: http://localhost:5199
          LINX_E2E_REUSE_SERVER: '0'
          LINX_E2E_CLOUD_IDENTITY_URL: http://localhost:5739
          LINX_E2E_LOGIN_VIA: custom
        run: |
          set -euo pipefail
          export LINX_E2E_ACCOUNT_EMAIL="$(node -p 'require("./tests/e2e/fixtures/standalone-seed.json")[0].email')"
          export LINX_E2E_ACCOUNT_PASSWORD="$(node -p 'require("./tests/e2e/fixtures/standalone-seed.json")[0].password')"
          export LINX_E2E_ACCOUNT_POD="$(node -p 'require("./tests/e2e/fixtures/standalone-seed.json")[0].pods[0].name')"
          cd tests/e2e
          npx playwright test specs/deployed-signed-in.spec.ts --reporter=list
      - name: xpod logs
        if: failure()
        run: docker logs --tail 300 xpod-standalone || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: standalone-e2e-results-${{ github.sha }}
          path: tests/e2e/test-results
          retention-days: 14

  build_image:
    needs: [metadata, verify, local_e2e, standalone_e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines
      - name: Build web
        env:
          VITE_APP_VERSION: ${{ needs.metadata.outputs.candidate }}
          VITE_CLOUD_IDENTITY_URL: ${{ env.CLOUD_IDENTITY_URL }}
          VITE_RELEASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          yarn workspace @linx/web build
          # version.json: what this build is, plus the module files the smoke checks for a JS type.
          node -e '
            const fs = require("fs"), path = require("path")
            const dist = "apps/web/dist"
            const modules = fs.readdirSync(path.join(dist, "assets")).filter((f) => f.endsWith(".mjs")).map((f) => `/assets/${f}`)
            fs.writeFileSync(path.join(dist, "version.json"), JSON.stringify({ version: process.argv[1], sourceSha: process.argv[2], modules }) + "\n")
          ' "${{ needs.metadata.outputs.candidate }}" "${{ needs.metadata.outputs.sourceSha }}"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_REPO }}:${{ needs.metadata.outputs.shaTag }}
            ${{ env.IMAGE_REPO }}:${{ needs.metadata.outputs.candidate }}

  deploy_and_accept:
    needs: [metadata, build_image]
    runs-on: ubuntu-latest
    environment: rc
    concurrency:
      group: linx-shared-rc
      cancel-in-progress: false
    env:
      KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
      NAMESPACE: ${{ vars.SEALOS_NAMESPACE }}
      # RC lives on the Sealos-assigned domain (e.g. <name>.sealosgzg.site), not ours.
      RC_HOST: ${{ vars.LINX_RC_HOST }}
      RC_URL: ${{ vars.LINX_RC_HOST && format('https://{0}', vars.LINX_RC_HOST) || '' }}
      RC_CERT_ISSUER: ${{ vars.LINX_RC_CERT_ISSUER || 'linx-letsencrypt' }}
      # Signed-in acceptance signs in to xpod's RC provider (not production id.undefineds.co) on
      # its Sealos domain (deploy/rc/xpod-rc-sealos.yaml) with a per-run account from xpod's RC
      # seed; this job brings xpod-rc up for it and puts it back afterwards.
      RC_PROVIDER_URL: https://ids.sealosgzg.site/
      RC_PROVIDER_API_URL: https://apis.sealosgzg.site
      RC_PROVIDER_HOSTS: ids.sealosgzg.site,podss.sealosgzg.site,apis.sealosgzg.site
      RC_SEED_SECRET: xpod-rc-seed-linx-${{ github.run_id }}-${{ github.run_attempt }}
      IMAGE: ${{ format('{0}@{1}', 'ghcr.io/undefinedsco/linx-web', needs.build_image.outputs.digest) }}
    steps:
      - uses: actions/checkout@v4
      - name: Check RC prerequisites
        run: |
          set -euo pipefail
          missing=0
          [ -n "$KUBE_CONFIG_DATA" ] || { echo "::error::cluster credential missing: set KUBE_CONFIG_DATA (base64 kubeconfig) on the rc Environment"; missing=1; }
          [ -n "$NAMESPACE" ] || { echo "::error::rc variable SEALOS_NAMESPACE is required"; missing=1; }
          [ -n "$RC_HOST" ] || { echo "::error::rc variable LINX_RC_HOST (Sealos-assigned host) is required"; missing=1; }
          [[ "$RC_HOST" =~ ^[a-z0-9.-]+$ ]] || { echo "::error::LINX_RC_HOST must be a bare host name"; missing=1; }
          [[ "${{ needs.build_image.outputs.digest }}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::invalid image digest"; missing=1; }
          exit "$missing"
      - name: Configure kubectl
        run: |
          set -euo pipefail
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl version --client
      - name: Deploy RC image by digest (single apply)
        run: |
          set -euo pipefail
          sed -e "s|__NAMESPACE__|${NAMESPACE}|g" -e "s|__IMAGE__|${IMAGE}|g" \
            -e "s|__HOST__|${RC_HOST}|g" -e "s|__CERT_ISSUER__|${RC_CERT_ISSUER}|g" \
            deploy/rc/linx-web-rc.yaml > "$RUNNER_TEMP/linx-web-rc.yaml"
          if grep -q '__[A-Z]*__' "$RUNNER_TEMP/linx-web-rc.yaml"; then echo "::error::unrendered placeholder"; exit 1; fi
          kubectl apply -f "$RUNNER_TEMP/linx-web-rc.yaml"
          kubectl -n "$NAMESPACE" rollout status deployment/linx-web-rc --timeout=300s
      - name: Check the running pod serves the candidate digest
        run: |
          set -euo pipefail
          image_id="$(kubectl -n "$NAMESPACE" get pods -l app=linx-web-rc -o jsonpath='{.items[?(@.status.phase=="Running")].status.containerStatuses[0].imageID}')"
          echo "$image_id"
          [[ "$image_id" == *"${{ needs.build_image.outputs.digest }}"* ]] || { echo "::error::pod imageID digest mismatch"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines
      - name: Static deploy check
        run: |
          set -euo pipefail
          # The first run waits for cert-manager to issue the RC certificate.
          for attempt in $(seq 1 30); do
            if node scripts/verify-web-static-deploy.mjs "$RC_URL/"; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Deployed-site smoke (Playwright)
        env:
          CI: '1'
          LINX_E2E_BASE_URL: ${{ env.RC_URL }}
          LINX_E2E_REUSE_SERVER: '0'
          LINX_E2E_CLOUD_IDENTITY_URL: ${{ env.CLOUD_IDENTITY_URL }}
          LINX_E2E_EXPECT_VERSION: ${{ needs.metadata.outputs.candidate }}
        run: |
          set -euo pipefail
          cd tests/e2e
          npx playwright install --with-deps chromium
          npx playwright test specs/deployed-web-smoke.spec.ts --reporter=list
      - name: Bring up the xpod RC provider with a per-run seed
        run: |
          set -euo pipefail
          # xpod's candidate owns xpod-rc while it runs and scales it to 0 afterwards; never take it over mid-run.
          replicas="$(kubectl -n "$NAMESPACE" get deployment xpod-rc -o jsonpath='{.spec.replicas}')"
          if [ "$replicas" != "0" ]; then
            echo "::error::deployment/xpod-rc is running ($replicas replicas), probably an xpod RC run; rerun this job once it is back at 0"
            exit 1
          fi
          # Alice and Bob are generated for this run (random passwords, masked in the log).
          node scripts/rc-provider-seed.mjs --output "$RUNNER_TEMP/rc.json" \
            --suffix "linx-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --github-env "$GITHUB_ENV"
          kubectl -n "$NAMESPACE" create secret generic "$RC_SEED_SECRET" --from-file=rc.json="$RUNNER_TEMP/rc.json" \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f "$RUNNER_TEMP/rc.json"
          sed -e "s|__NAMESPACE__|${NAMESPACE}|g" -e "s|__CERT_ISSUER__|${RC_CERT_ISSUER}|g" deploy/rc/xpod-rc-sealos.yaml | kubectl apply -f -
          # Saved so the cleanup step can put xpod-rc back exactly as xpod left it.
          kubectl -n "$NAMESPACE" get deployment xpod-rc -o json > "$RUNNER_TEMP/xpod-rc-before.json"
          kubectl -n "$NAMESPACE" patch deployment xpod-rc --type=json -p "$(node scripts/xpod-rc-provider-patch.mjs up \
            "$RUNNER_TEMP/xpod-rc-before.json" "$RC_SEED_SECRET" "$RC_PROVIDER_URL" "$RC_PROVIDER_API_URL" "$RC_PROVIDER_HOSTS")"
          kubectl -n "$NAMESPACE" rollout status deployment/xpod-rc --timeout=1800s
          for attempt in $(seq 1 30); do
            if curl -fsS "${RC_PROVIDER_URL%/}/.well-known/openid-configuration" > /dev/null; then exit 0; fi
            sleep 10
          done
          echo "::error::${RC_PROVIDER_URL} did not serve OpenID discovery"
          exit 1
      - name: Signed-in acceptance (xpod RC seed account)
        env:
          CI: '1'
          LINX_E2E_BASE_URL: ${{ env.RC_URL }}
          LINX_E2E_REUSE_SERVER: '0'
          LINX_E2E_CLOUD_IDENTITY_URL: ${{ env.RC_PROVIDER_URL }}
          LINX_E2E_LOGIN_VIA: custom
          LINX_E2E_EXPECT_MODEL_REPLY: ${{ vars.LINX_RC_EXPECT_MODEL_REPLY || '1' }}
        run: |
          set -euo pipefail
          cd tests/e2e
          npx playwright test specs/deployed-signed-in.spec.ts --reporter=list
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rc-acceptance-results-${{ github.sha }}
          path: tests/e2e/test-results
          retention-days: 14
      - name: Scale the xpod RC provider back down
        if: always()
        run: |
          set -euo pipefail
          [ -f ~/.kube/config ] || exit 0
          # Only when xpod-rc still runs this job's seed: an xpod RC run that took over keeps its own.
          current="$(kubectl -n "$NAMESPACE" get deployment xpod-rc -o jsonpath='{.spec.template.spec.volumes[?(@.name=="xpod-rc-seed")].secret.secretName}' || true)"
          if [ "$current" = "$RC_SEED_SECRET" ] && [ -f "$RUNNER_TEMP/xpod-rc-before.json" ]; then
            kubectl -n "$NAMESPACE" patch deployment xpod-rc --type=json -p "$(node scripts/xpod-rc-provider-patch.mjs restore "$RUNNER_TEMP/xpod-rc-before.json")"
          fi
          kubectl -n "$NAMESPACE" delete secret "$RC_SEED_SECRET" --ignore-not-found
      - name: Write acceptance record
        run: |
          set -euo pipefail
          mkdir -p acceptance
          node -e '
            const [candidate, sourceSha, digest, rcUrl, provider, runUrl] = process.argv.slice(1)
            const record = {
              schema: "linx-web-release-acceptance/1",
              candidate, sourceSha, branch: "staging",
              image: `ghcr.io/undefinedsco/linx-web@${digest}`, digest,
              rcUrl, provider, runUrl,
              acceptedAt: new Date().toISOString(),
              checks: { verify: "passed", "local-e2e": "passed", "standalone-e2e": "passed", "deployed-digest": "passed", "static-deploy": "passed", "deployed-smoke": "passed", "signed-in": "passed" },
            }
            require("fs").writeFileSync("acceptance/release-acceptance.json", JSON.stringify(record, null, 2) + "\n")
          ' "${{ needs.metadata.outputs.candidate }}" "${{ needs.metadata.outputs.sourceSha }}" \
            "${{ needs.build_image.outputs.digest }}" "$RC_URL" "$RC_PROVIDER_URL" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cat acceptance/release-acceptance.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-acceptance-${{ needs.metadata.outputs.sourceSha }}
          path: acceptance/release-acceptance.json
          retention-days: 90
      - name: Scale the RC site down
        if: always()
        run: |
          set -euo pipefail
          # The RC site runs only while it is being accepted; Service, Ingress and certificate stay.
          [ -f ~/.kube/config ] || exit 0
          kubectl -n "$NAMESPACE" scale deployment/linx-web-rc --replicas=0 || true
