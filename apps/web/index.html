<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%linx-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinX - Your AI Secretary</title>
    <style>
      /* Boot splash painted from the HTML itself so the page is never blank while JS chunks load; React replaces it on first render. */
      #boot-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #fff; color: #6b7280; font: 13px/1.4 system-ui, sans-serif; }
      #boot-splash .spinner { width: 22px; height: 22px; border-radius: 50%; border: 2px solid currentColor; border-top-color: transparent; animation: boot-spin 0.8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) { #boot-splash { background: #0a0a0a; color: #9ca3af; } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot-splash" role="status" aria-live="polite"><div class="spinner"></div><div>LinX 正在启动…</div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
