server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # Alpine's bundled mime.types does not consistently include ES module
  # assets. pdf.js loads its worker as an .mjs module, and browsers reject the
  # default application/octet-stream response when nosniff is enabled.
  location ~* \.mjs$ {
    try_files $uri =404;
    default_type application/javascript;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location ~* \.(?:css|js|woff2?|png|jpe?g|gif|svg|ico|webp)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
