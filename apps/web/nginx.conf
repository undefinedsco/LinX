server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  # ChatKit is code-split on the CDN. Retry transient edge/TLS failures so a
  # single upstream connection drop does not leave the embedded composer blank.
  proxy_connect_timeout 15s;
  proxy_read_timeout 60s;
  proxy_next_upstream error timeout http_502 http_503 http_504;
  proxy_next_upstream_tries 3;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # Keep ChatKit's closed-source iframe and its code-split assets on the app
  # origin. This makes local HTTP and deployed HTTPS follow one browser path.
  location ^~ /chatkit-cdn/ {
    proxy_ssl_server_name on;
    proxy_ssl_name cdn.platform.openai.com;
    proxy_set_header Host cdn.platform.openai.com;
    proxy_pass https://cdn.platform.openai.com/;
  }

  location ^~ /assets/ck1/ {
    proxy_ssl_server_name on;
    proxy_ssl_name cdn.platform.openai.com;
    proxy_set_header Host cdn.platform.openai.com;
    proxy_pass https://cdn.platform.openai.com;
  }

  location ^~ /cdn-cgi/ {
    proxy_ssl_server_name on;
    proxy_ssl_name cdn.platform.openai.com;
    proxy_set_header Host cdn.platform.openai.com;
    proxy_pass https://cdn.platform.openai.com;
  }

  # Alpine's bundled mime.types does not consistently include ES module
  # assets. pdf.js loads its worker as an .mjs module, and browsers reject the
  # default application/octet-stream response when nosniff is enabled.
  location ~* \.mjs$ {
    try_files $uri =404;
    default_type application/javascript;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location ~* \.(?:css|js|woff2?|png|jpe?g|gif|svg|ico|webp)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
