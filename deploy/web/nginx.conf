# LinX Web: a static single-page app.
# - Hashed build output under /assets/ is immutable; a missing asset is a real 404, never
#   the app shell (scripts/verify-web-static-deploy.mjs fails on HTML served for a script).
# - Every other path that is not a file falls back to index.html (client-side routes).
# - index.html is never cached, so a new release is picked up on the next load.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
