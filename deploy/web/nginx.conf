# LinX Web: a static single-page app (the production linx-web config, minus the ChatKit CDN
# proxies that went away with ChatKit).
# - Hashed build output is immutable; a missing file is a real 404, never the app shell
#   (scripts/verify-web-static-deploy.mjs fails on HTML served for a script).
# - .mjs is served as JavaScript: pdf.js loads its worker as a module, and Alpine's mime.types
#   would answer application/octet-stream, which browsers refuse for module scripts.
# - Client-side routes fall back to index.html; index.html is never cached.
# nginx drops server-level add_header in any location that sets its own, so every location
# repeats the security headers.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Cache-Control "no-store";
    }

    location = /version.json {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Cache-Control "no-store";
    }

    location ~* \.mjs$ {
        try_files $uri =404;
        default_type application/javascript;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:css|js|woff2?|png|jpe?g|gif|svg|ico|webp)$ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /assets/ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Cache-Control "no-cache";
    }
}
