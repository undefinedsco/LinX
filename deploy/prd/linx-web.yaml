# LinX Web production (linx.undefineds.cn, Guangzhou ns-iknkxtc8).
#
# Rendered by .github/workflows/promote.yml with the digest from the accepted RC record
# (release-acceptance-<sha>) and applied with `kubectl replace`, so the whole Deployment spec
# is this file: the files come from the accepted image, not from the PVC `linx-web-content`
# the earlier hand-synced Deployment mounted. Name, `app: linx-web` selector and port 8080
# (`http`) stay as they were, so Service/linx-web and the gateway route are unchanged.
#
# Roll back with `kubectl -n <ns> rollout undo deployment/linx-web` (the previous ReplicaSet,
# PVC-based, is kept by revisionHistoryLimit) or by promoting an earlier accepted tag.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linx-web
  namespace: __NAMESPACE__
  labels:
    app: linx-web
    app.kubernetes.io/name: linx-web
    app.kubernetes.io/instance: production
    app.kubernetes.io/managed-by: linx-promote-workflow
  annotations:
    linx.undefineds.co/release: __VERSION__
    linx.undefineds.co/source-sha: __SOURCE_SHA__
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: linx-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: linx-web
        app.kubernetes.io/name: linx-web
        app.kubernetes.io/instance: production
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: linx-web
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
