# LinX Web release candidate (RC).
#
# Rendered by .github/workflows/candidate.yml: __NAMESPACE__, __IMAGE__, __HOST__ and
# __CERT_ISSUER__ are replaced with the RC Environment's namespace, the candidate's immutable
# image digest, the Sealos-domain host (vars.LINX_RC_HOST, e.g. <name>.sealosgzg.site) and the
# cert-manager Issuer that signs its certificate (vars.LINX_RC_CERT_ISSUER, default
# `linx-letsencrypt`, the issuer already used for linx.undefineds.cn), then the result is
# applied once. Do not set the image or restart the Deployment in separate steps.
#
# RC stays on the Sealos domain: no undefineds.* DNS, no shared-gateway route. Only RC-owned
# objects live here (Deployment, Service and Ingress `linx-web-rc`).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linx-web-rc
  namespace: __NAMESPACE__
  labels:
    app: linx-web-rc
    app.kubernetes.io/name: linx-web
    app.kubernetes.io/instance: rc
    app.kubernetes.io/managed-by: linx-candidate-workflow
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: linx-web-rc
  template:
    metadata:
      labels:
        app: linx-web-rc
        app.kubernetes.io/name: linx-web
        app.kubernetes.io/instance: rc
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: linx-web
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: linx-web-rc
  namespace: __NAMESPACE__
  labels:
    app: linx-web-rc
spec:
  selector:
    app: linx-web-rc
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linx-web-rc
  namespace: __NAMESPACE__
  labels:
    app: linx-web-rc
  annotations:
    # The Sealos ingress has no default certificate for unknown *.sealosgzg.site hosts; like the
    # existing Sealos-domain hosts in this namespace, the certificate comes from cert-manager.
    cert-manager.io/issuer: __CERT_ISSUER__
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - __HOST__
      secretName: linx-web-rc-tls
  rules:
    - host: __HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: linx-web-rc
                port:
                  name: http
