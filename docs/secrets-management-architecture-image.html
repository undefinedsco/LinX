<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LinX 密钥管理架构图</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #2563eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .page {
      min-height: 100vh;
      padding: 28px;
      display: grid;
      gap: 18px;
      align-content: start;
    }

    .header {
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
    }

    p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      height: 34px;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 650;
    }

    .btn.primary {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    .canvas {
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      overflow: auto;
      box-shadow: 0 18px 48px rgba(20, 29, 40, 0.08);
    }

    .canvas img {
      display: block;
      width: 1120px;
      max-width: none;
      height: auto;
    }

    .note {
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 14px 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    @media (max-width: 760px) {
      .page {
        padding: 16px;
      }

      .header {
        align-items: flex-start;
        flex-direction: column;
      }

      .actions {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div>
        <h1>密钥管理模块架构图</h1>
        <p>展示密钥管理 UI、Secret CRUD、Pod 存储、模型管理和运行时消费者之间的调用关系。</p>
      </div>
      <div class="actions">
        <a class="btn" href="./secrets-management-design.html">打开交互原型</a>
        <a class="btn primary" href="./assets/diagrams/secrets-management-architecture.svg">打开 SVG</a>
      </div>
    </header>

    <section class="canvas" aria-label="密钥管理架构图">
      <img src="./assets/diagrams/secrets-management-architecture.svg" alt="LinX 密钥管理模块架构图">
    </section>

    <section class="note">
      这张图对应第一版设计边界：密钥管理先作为独立模块提供通用 Secret 管理能力；模型管理后续通过 Secret 引用读取 API Key，避免 Key 分散存储在多个模块中。
    </section>
  </main>
</body>
</html>
