<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" width="1120" height="720" role="img" aria-labelledby="title desc">
  <title id="title">LinX 密钥管理模块架构图</title>
  <desc id="desc">展示密钥管理 UI、密钥服务、Pod 存储和模型管理等调用关系。</desc>
  <style>
    text {
      font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Microsoft JhengHei", "SimHei", sans-serif;
    }
    .title { fill: #111827; font-size: 24px; font-weight: 700; }
    .subtitle { fill: #6b7280; font-size: 13px; }
    .layer-title { fill: #374151; font-size: 13px; font-weight: 700; }
    .node-title { fill: #111827; font-size: 15px; font-weight: 700; }
    .node-sub { fill: #6b7280; font-size: 12px; }
    .label { fill: #4b5563; font-size: 12px; font-weight: 600; }
    .small { fill: #6b7280; font-size: 11px; }
    .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; }
    .soft { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1.3; }
    .blue { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.5; }
    .green { fill: #f0fdf4; stroke: #bbf7d0; stroke-width: 1.5; }
    .purple { fill: #faf5ff; stroke: #e9d5ff; stroke-width: 1.5; }
    .orange { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.5; }
    .teal { fill: #f0fdfa; stroke: #99f6e4; stroke-width: 1.5; }
    .red { fill: #fef2f2; stroke: #fecaca; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#9333ea"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="1120" height="720" fill="#ffffff"/>
  <text x="40" y="48" class="title">LinX 密钥管理模块</text>
  <text x="40" y="72" class="subtitle">第一版目标：通用 Secret 管理，与模型管理同级；后续支持模型接入点引用密钥。</text>

  <rect x="40" y="105" width="1040" height="132" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="60" y="130" class="layer-title">前端交互层</text>

  <rect x="70" y="150" width="170" height="58" rx="8" class="blue"/>
  <text x="94" y="174" class="node-title">密钥列表</text>
  <text x="94" y="194" class="node-sub">搜索 / 类型 / 状态</text>

  <rect x="282" y="150" width="170" height="58" rx="8" class="blue"/>
  <text x="306" y="174" class="node-title">密钥详情</text>
  <text x="306" y="194" class="node-sub">显示 / 复制 / 删除</text>

  <rect x="494" y="150" width="170" height="58" rx="8" class="blue"/>
  <text x="518" y="174" class="node-title">新增/编辑弹窗</text>
  <text x="518" y="194" class="node-sub">名称 / Key / Value</text>

  <rect x="706" y="150" width="170" height="58" rx="8" class="blue"/>
  <text x="730" y="174" class="node-title">引用提示</text>
  <text x="730" y="194" class="node-sub">被谁使用 / 预留</text>

  <rect x="918" y="150" width="130" height="58" rx="8" class="soft"/>
  <text x="944" y="174" class="node-title">UI Store</text>
  <text x="944" y="194" class="node-sub">选中项状态</text>

  <path d="M240 179 L282 179" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M452 179 L494 179" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M876 179 L918 179" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="248" y="169" class="small">选择</text>
  <text x="459" y="169" class="small">编辑</text>
  <text x="882" y="169" class="small">同步</text>

  <rect x="40" y="280" width="1040" height="154" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="60" y="306" class="layer-title">模块能力层</text>

  <rect x="92" y="328" width="210" height="72" rx="8" class="green"/>
  <text x="120" y="354" class="node-title">useSecrets</text>
  <text x="120" y="376" class="node-sub">读取 / 新增 / 更新 / 删除</text>

  <rect x="356" y="328" width="210" height="72" rx="8" class="green"/>
  <text x="384" y="354" class="node-title">Secret Collection</text>
  <text x="384" y="376" class="node-sub">TanStack DB + Solid Pod</text>

  <rect x="620" y="328" width="210" height="72" rx="8" class="green"/>
  <text x="648" y="354" class="node-title">Secret Schema</text>
  <text x="648" y="376" class="node-sub">类型 / 项目 / 状态 / 过期</text>

  <rect x="884" y="328" width="150" height="72" rx="8" class="orange"/>
  <text x="912" y="354" class="node-title">操作审计</text>
  <text x="912" y="376" class="node-sub">显示 / 复制 / 轮换</text>

  <path d="M155 208 L155 328" stroke="#16a34a" stroke-width="1.8" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M367 208 L367 301 Q367 328 336 346 L302 364" stroke="#16a34a" stroke-width="1.8" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M579 208 L579 284 Q579 318 548 340" stroke="#16a34a" stroke-width="1.8" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M302 364 L356 364" stroke="#16a34a" stroke-width="1.8" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M566 364 L620 364" stroke="#16a34a" stroke-width="1.8" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M830 364 L884 364" stroke="#ea580c" stroke-width="1.8" fill="none" marker-end="url(#arrow-orange)"/>
  <text x="190" y="288" class="small">CRUD</text>
  <text x="476" y="349" class="small">持久化</text>
  <text x="842" y="350" class="small">记录</text>

  <rect x="40" y="478" width="1040" height="116" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="60" y="504" class="layer-title">存储与消费者</text>

  <path d="M149 543 C149 526 245 526 245 543 L245 570 C245 587 149 587 149 570 Z" class="purple"/>
  <ellipse cx="197" cy="543" rx="48" ry="17" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="164" y="560" class="node-title">Solid Pod</text>
  <text x="153" y="580" class="node-sub">用户自有数据</text>

  <rect x="332" y="526" width="180" height="58" rx="8" class="teal"/>
  <text x="360" y="550" class="node-title">模型管理</text>
  <text x="360" y="570" class="node-sub">引用 API Key Secret</text>

  <rect x="572" y="526" width="180" height="58" rx="8" class="teal"/>
  <text x="600" y="550" class="node-title">LinX Service</text>
  <text x="600" y="570" class="node-sub">运行时读取引用</text>

  <rect x="812" y="526" width="180" height="58" rx="8" class="teal"/>
  <text x="840" y="550" class="node-title">部署/脚本</text>
  <text x="840" y="570" class="node-sub">Token / Webhook</text>

  <path d="M461 400 L461 454 Q461 478 420 493 L245 555" stroke="#9333ea" stroke-width="1.8" fill="none" marker-end="url(#arrow-purple)"/>
  <path d="M422 526 L422 474 Q422 448 496 426 L628 388" stroke="#9333ea" stroke-width="1.8" fill="none" marker-end="url(#arrow-purple)"/>
  <path d="M662 526 L662 474 Q662 448 686 426 L724 400" stroke="#9333ea" stroke-width="1.8" fill="none" marker-end="url(#arrow-purple)"/>
  <path d="M902 526 L902 460 Q902 434 944 400" stroke="#9333ea" stroke-width="1.8" fill="none" marker-end="url(#arrow-purple)"/>
  <text x="292" y="492" class="small">写入 Secret</text>
  <text x="436" y="510" class="small">引用读取</text>
  <text x="678" y="510" class="small">运行时读取</text>
  <text x="918" y="510" class="small">脚本读取</text>

  <rect x="40" y="630" width="1040" height="54" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
  <line x1="64" y1="650" x2="102" y2="650" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="112" y="654" class="small">UI 交互</text>
  <line x1="212" y1="650" x2="250" y2="650" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <text x="260" y="654" class="small">CRUD / 数据写入</text>
  <line x1="402" y1="650" x2="440" y2="650" stroke="#9333ea" stroke-width="1.8" marker-end="url(#arrow-purple)"/>
  <text x="450" y="654" class="small">Secret 引用/读取</text>
  <line x1="624" y1="650" x2="662" y2="650" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <text x="672" y="654" class="small">审计/生命周期事件</text>
  <text x="64" y="674" class="small">第一版不做完整密码库，先做 LinX 内部 Secrets Manager。</text>
</svg>
