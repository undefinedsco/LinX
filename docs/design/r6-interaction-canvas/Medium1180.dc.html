<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>中等宽度 1180</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#F7F4ED}
a{color:#563E84;text-underline-offset:3px}
.root{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif;color:#2B2621;font-size:14px;line-height:1.55}
.ib{width:32px;height:32px;border:0;border-radius:6px;background:transparent;color:#655D53;display:inline-flex;align-items:center;justify-content:center;padding:0;text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 14px;border-radius:6px;border:1px solid #87837D;background:#FBFAF7;color:#2B2621;font:inherit;font-size:13px;font-weight:500;white-space:nowrap;text-decoration:none}
.btn.primary{background:#563E84;border-color:#563E84;color:#F7F4ED}
.av{width:36px;height:36px;border-radius:6px;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.me{background:#E0DBDE;padding:9px 12px;border-radius:8px;max-width:68%}
.ai{background:#FBFAF7;padding:9px 12px;border-radius:8px;max-width:68%;border:1px solid #DFDBD5}
.grp{background:#FBFAF7;border-radius:10px;overflow:hidden;margin:0 12px}
.gr{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-bottom:1px solid #DFDBD5;font-size:13px;text-decoration:none;color:#2B2621}
.gr:last-child{border-bottom:0}
.gl{padding:16px 24px 6px;font-size:12px;color:#655D53}
</style>
</helmet>
<div class="root" style="width: 1180px; height: 800px; overflow: hidden; display: flex; background: #F7F4ED; position: relative">
  <div style="flex: 0 0 64px; background: #E4DDDA; overflow: hidden">
    <dc-import name="Nav" active="chat" inbox-count="3" hint-size="64px,800px"></dc-import>
  </div>
  <div style="flex: 0 0 280px; background: #F2EDE2; overflow: hidden">
    <dc-import name="ChatList" selected="volunteer" variant="normal" hint-size="280px,800px"></dc-import>
  </div>

  <main aria-label="内容栏" style="flex: 1; min-width: 0; display: flex; flex-direction: column">
    <header style="height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 20px; border-bottom: 1px solid #DFDBD5">
      <h1 style="margin: 0; font-size: 15px; font-weight: 600">LinX 助手</h1>
      <span style="display: inline-flex; align-items: center; height: 26px; padding: 0 8px; border-radius: 6px; background: #E9E4E4; font-size: 12px"># 志愿者排班方案 ▾</span>
      <span style="flex: 1"></span>
      <button class="ib" aria-label="收起聊天信息" aria-expanded="true" style="background: #E4DDDA; color: #2B2621"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M15 4v16"></path></svg></button>
    </header>
    <div style="flex: 1; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; gap: 10px; justify-content: flex-end; align-items: flex-start">
        <div class="me">下周开始志愿者要排班：每周 6 个人，周六、周日各两个时段。帮我比较共享日历、排班小程序和自己搭一个表单。</div>
        <span class="av" style="background: #E0DBDE">林</span>
      </div>
      <div style="display: flex; gap: 10px; align-items: flex-start">
        <span class="av" style="background: #563E84; color: #F7F4ED">AI</span>
        <div class="ai">建议用<strong>共享日历加提醒</strong>：你们 2 个人维护，志愿者都有日历账号，最省事。</div>
      </div>
    </div>
    <footer style="border-top: 1px solid #DFDBD5; padding: 10px 16px 14px; display: flex; align-items: flex-end; gap: 8px">
      <label for="m1" style="position: absolute; left: -9999px">消息</label>
      <textarea id="m1" rows="2" style="flex: 1; border: 0; outline: none; resize: none; background: transparent; font: inherit; color: #2B2621"></textarea>
      <button class="btn primary">发送</button>
    </footer>
  </main>

  <aside aria-label="聊天信息（浮在内容上）" style="position: absolute; right: 0; top: 0; bottom: 0; width: 300px; background: #F2EDE2; border-left: 1px solid #DFDBD5; box-shadow: -12px 0 24px rgb(43 38 33 / .10)">
    <div style="height: 56px; box-sizing: border-box; display: flex; align-items: center; padding: 0 8px 0 16px; border-bottom: 1px solid #DFDBD5; font-weight: 600"><span style="flex: 1">聊天信息</span>
      <button class="ib" aria-label="关闭聊天信息"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
    </div>
    <div class="grp" style="margin-top: 14px">
      <a class="gr" href="PeopleStates.dc.html"><span style="flex: 1">LinX 助手</span><span style="color: #87837D">›</span></a>
      <a class="gr" href="Method.dc.html"><span style="flex: 1">做事的方法</span><span style="color: #655D53">书店日常</span><span style="color: #87837D">›</span></a>
      <a class="gr" href="NotAppliedStates.dc.html"><span style="flex: 1">执行条件</span><span style="color: #655D53">云端模型</span><span style="color: #87837D">›</span></a>
    </div>
    <div class="gl"></div>
    <div class="grp">
      <a class="gr" href="Search.dc.html"><span style="flex: 1">查找聊天记录</span><span style="color: #655D53">消息、文件、图片</span><span style="color: #87837D">›</span></a>
    </div>
    <div style="padding: 16px 24px; font-size: 12px; color: #655D53">窗口窄于 1280 时，聊天信息浮在内容上；点外面或 Esc 关闭。</div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
