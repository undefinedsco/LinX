<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>个人模型</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#F7F4ED}
a{color:#563E84;text-underline-offset:3px}a:hover{color:#4B3672}
.root{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif;color:#2B2621;font-size:14px;line-height:1.55}
.btn{display:inline-flex;align-items:center;justify-content:center;height:32px;padding:0 16px;border-radius:6px;border:1px solid #87837D;background:#FBFAF7;color:#2B2621;font:inherit;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn.primary{background:#563E84;border-color:#563E84;color:#F7F4ED}
.gl{padding:22px 4px 8px;font-size:13px;font-weight:600}
.grp{background:#FBFAF7;border-radius:12px;overflow:hidden;border:1px solid #DFDBD5}
.gr{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 16px;border-bottom:1px solid #DFDBD5;font-size:14px}
.gr:last-child{border-bottom:0}
.s{font-size:12px;color:#655D53;line-height:1.5}
.v{color:#655D53;font-size:13px}
.step{display:flex;align-items:center;gap:6px;font-size:13px;color:#655D53}
.dot{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;border:1px solid #87837D}
.rgl{padding:16px 24px 6px;font-size:12px;color:#655D53}
</style>
</helmet>
<div class="root" style="display: flex; flex-wrap: wrap; min-height: 900px; background: #F7F4ED">
  <div style="flex: 0 0 64px; align-self: stretch; background: #E4DDDA">
    <dc-import name="Nav" active="myai" inbox-count="3" hint-size="64px,900px"></dc-import>
  </div>
  <div style="flex: 0 0 280px; align-self: stretch; background: #F2EDE2">
    <dc-import name="AINav" selected="model" hint-size="280px,900px"></dc-import>
  </div>

  <main aria-label="内容栏：个人模型" style="flex: 999 1 480px; min-width: 0; display: flex; flex-direction: column; min-height: 900px">
    <header style="height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 20px; border-bottom: 1px solid #DFDBD5">
      <h1 style="margin: 0; font-size: 15px; font-weight: 600">个人模型</h1>
      <span class="s">还没有训练</span>
    </header>

    <div style="width: 100%; max-width: 640px; box-sizing: border-box; padding: 20px 24px 40px; align-self: center">
      <ol aria-label="步骤" style="list-style: none; margin: 0; padding: 0; display: flex; gap: 18px; flex-wrap: wrap">
        <li class="step" aria-current="step" style="color: #563E84; font-weight: 600"><span class="dot" style="background: #563E84; border-color: #563E84; color: #F7F4ED">1</span>准备材料</li>
        <li class="step"><span class="dot">2</span>训练</li>
        <li class="step"><span class="dot">3</span>比较</li>
        <li class="step"><span class="dot">4</span>启用</li>
      </ol>

      <div class="gl">用哪些材料</div>
      <div class="grp">
        <label class="gr"><input type="checkbox" checked style="accent-color: #563E84"><span style="flex: 1">已确认的卡片</span><span class="v">12</span></label>
        <label class="gr"><input type="checkbox" checked style="accent-color: #563E84"><span style="flex: 1">你改过的 AI 结果<br><span class="s">只用你明确改过的，不包括点赞</span></span><span class="v">23</span></label>
        <label class="gr"><input type="checkbox" style="accent-color: #563E84"><span style="flex: 1">聊天记录<br><span class="s">包含别人说的话，默认不选</span></span><span class="v">—</span></label>
        <div class="gr"><span style="flex: 1">文件夹</span><span class="v">选择…</span></div>
      </div>
      <div class="s" style="padding: 8px 4px 0">会自动留出 5 个任务不参加训练，用来比较新旧模型。</div>

      <div class="gl">在哪里训练</div>
      <div class="grp">
        <div class="gr"><span style="flex: 1">训练服务</span><span class="v">还没接通</span></div>
        <div class="gr"><span style="flex: 1">材料会发到</span><span class="v">接通后在这里写明</span></div>
      </div>

      <div style="display: flex; gap: 10px; align-items: center; margin-top: 24px; flex-wrap: wrap">
        <button class="btn primary">保存材料清单</button>
        <button class="btn" aria-disabled="true" style="color: #655D53">开始训练</button>
        <span class="s">暂时不能训练：训练服务还没接通</span>
      </div>
    </div>
  </main>

  <aside aria-label="右边栏：说明" style="flex: 0 0 300px; box-sizing: border-box; background: #F2EDE2; border-left: 1px solid #DFDBD5; min-height: 900px">
    <div style="height: 56px; box-sizing: border-box; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #DFDBD5; font-weight: 600; font-size: 14px">说明</div>
    <div style="padding: 16px 24px; display: flex; flex-direction: column; gap: 12px; font-size: 13px">
      <div>不训练也能正常使用 LinX。</div>
      <div>训练完成后先和原来的比较，你选了才启用。</div>
      <div>新模型没有更好，就继续用原来的。</div>
      <div>之后撤回某份材料，下次训练就不再用它；已经训练好的模型不会因此“忘掉”。</div>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
