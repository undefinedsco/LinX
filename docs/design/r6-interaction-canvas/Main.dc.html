<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>聊天首页</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#F7F4ED}
a{color:#563E84;text-underline-offset:3px}a:hover{color:#4B3672}
.root{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif;color:#2B2621;font-size:14px;line-height:1.55}
.ib{width:32px;height:32px;border:0;border-radius:6px;background:transparent;color:#655D53;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ib:hover{background:#E9E4E4}
.btn{display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 14px;border-radius:6px;border:1px solid #87837D;background:#FBFAF7;color:#2B2621;font:inherit;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.primary{background:#563E84;border-color:#563E84;color:#F7F4ED}
.av{width:36px;height:36px;border-radius:6px;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.me{background:#E0DBDE;padding:9px 12px;border-radius:8px;max-width:68%}
.ai{background:#FBFAF7;padding:9px 12px;border-radius:8px;max-width:68%;border:1px solid #DFDBD5}
.sys{align-self:center;font-size:12px;color:#655D53}
.grp{background:#FBFAF7;border-radius:10px;overflow:hidden;margin:0 12px}
.gr{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-bottom:1px solid #DFDBD5;font-size:13px;text-decoration:none;color:#2B2621}
.gr:last-child{border-bottom:0}
.gl{padding:16px 24px 6px;font-size:12px;color:#655D53}
.sw{width:34px;height:20px;border-radius:999px;position:relative;flex:none}
</style>
</helmet>
<div class="root" style="display: flex; flex-wrap: wrap; min-height: 900px; background: #F7F4ED">
  <div style="flex: 0 0 64px; align-self: stretch; background: #E4DDDA">
    <dc-import name="Nav" active="chat" inbox-count="3" hint-size="64px,900px"></dc-import>
  </div>
  <div style="flex: 0 0 280px; align-self: stretch; background: #F2EDE2">
    <dc-import name="ChatList" selected="volunteer" variant="normal" hint-size="280px,900px"></dc-import>
  </div>

  <main aria-label="内容栏" style="flex: 999 1 480px; min-width: 0; display: flex; flex-direction: column; min-height: 900px">
    <header style="height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 20px; border-bottom: 1px solid #DFDBD5">
      <h1 style="margin: 0; font-size: 15px; font-weight: 600">LinX 助手</h1>
      <button aria-haspopup="listbox" style="display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 8px; border: 0; border-radius: 6px; background: #E9E4E4; font: inherit; font-size: 12px; color: #2B2621; cursor: pointer">
        # 志愿者排班方案
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
      <span style="flex: 1"></span>
      <button class="ib" aria-label="收起聊天信息" aria-expanded="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M15 4v16"></path></svg>
      </button>
    </header>

    <div style="flex: 1; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px">
      <div class="sys">已回到上次的位置</div>

      <div style="display: flex; gap: 10px; justify-content: flex-end; align-items: flex-start">
        <div class="me">下周开始志愿者要排班：每周 6 个人，周六、周日各两个时段。帮我比较共享日历、排班小程序和自己搭一个表单。</div>
        <span class="av" style="background: #E0DBDE">林</span>
      </div>

      <div style="display: flex; gap: 10px; align-items: flex-start">
        <span class="av" style="background: #563E84; color: #F7F4ED">AI</span>
        <div style="display: flex; flex-direction: column; gap: 6px; max-width: 68%">
          <div class="ai" style="max-width: none">建议用<strong>共享日历加提醒</strong>：你们 2 个人维护，志愿者都有日历账号，最省事。排班小程序要多装一个应用；自建表单要长期维护。</div>
          <a href="Card.dc.html" style="font-size: 12px; color: #655D53; text-decoration: none">依据：维护成本 ›</a>
        </div>
      </div>

      <div style="display: flex; gap: 10px; align-items: flex-start">
        <span class="av" style="background: #563E84; color: #F7F4ED">AI</span>
        <div class="ai" style="display: flex; flex-direction: column; gap: 10px; min-width: 300px">
          <div style="font-weight: 600">发送排班日历邀请？</div>
          <div style="font-size: 13px; color: #655D53">发给 6 位志愿者</div>
          <div style="display: flex; gap: 8px">
            <a class="btn primary" href="Decision.dc.html">查看并决定</a>
          </div>
        </div>
      </div>
    </div>

    <footer style="border-top: 1px solid #DFDBD5; padding: 6px 16px 14px; display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; gap: 2px">
        <button class="ib" aria-label="添加文件">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"></path></svg>
        </button>
        <button class="ib" aria-label="从文件引用">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2z"></path></svg>
        </button>
        <button class="ib" aria-label="截图">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14M18 22V8a2 2 0 0 0-2-2H2"></path></svg>
        </button>
      </div>
      <label for="composer" style="position: absolute; left: -9999px">消息</label>
      <textarea id="composer" rows="3" style="border: 0; outline: none; resize: none; background: transparent; font: inherit; color: #2B2621; padding: 0 4px">共享日历先试两周，看志愿者回复率再定。</textarea>
      <div style="display: flex; justify-content: flex-end">
        <button class="btn primary">发送</button>
      </div>
    </footer>
  </main>

  <aside aria-label="右边栏：详情" style="flex: 0 0 300px; box-sizing: border-box; background: #F2EDE2; border-left: 1px solid #DFDBD5; min-height: 900px">
    <div style="height: 56px; box-sizing: border-box; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #DFDBD5; font-weight: 600">聊天信息</div>
    <div class="grp" style="margin-top: 14px">
      <a class="gr" href="PeopleStates.dc.html" style="min-height: 56px"><span class="av" style="width: 32px; height: 32px; background: #563E84; color: #F7F4ED; font-size: 11px">AI</span><span style="flex: 1">LinX 助手</span><span style="color: #87837D">›</span></a>
      <a class="gr" href="Method.dc.html"><span style="flex: 1">做事的方法</span><span style="color: #655D53">书店日常</span><span style="color: #87837D">›</span></a>
      <a class="gr" href="NotAppliedStates.dc.html"><span style="flex: 1">执行条件</span><span style="color: #655D53">云端模型</span><span style="color: #87837D">›</span></a>
    </div>
    <div class="gl"></div>
    <div class="grp">
      <a class="gr" href="Search.dc.html"><span style="flex: 1">查找聊天记录</span><span style="color: #655D53">消息、文件、图片</span><span style="color: #87837D">›</span></a>
    </div>
    <div class="gl"></div>
    <div class="grp">
      <div class="gr"><span style="flex: 1">标星</span><span class="sw" role="switch" aria-checked="true" aria-label="标星" style="background: #563E84"><span style="position: absolute; right: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #F7F4ED"></span></span></div>
      <div class="gr"><span style="flex: 1">免打扰</span><span class="sw" role="switch" aria-checked="false" aria-label="免打扰" style="background: #87837D"><span style="position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #F7F4ED"></span></span></div>
    </div>
    <div class="gl"></div>
    <div class="grp"><a class="gr" href="ListMenus.dc.html" style="justify-content: center">删除会话…</a></div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
