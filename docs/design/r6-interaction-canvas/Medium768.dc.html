<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>中等宽度 768</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#F7F4ED}
a{color:#563E84;text-underline-offset:3px}
.root{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif;color:#2B2621;font-size:14px;line-height:1.55}
.ib{width:32px;height:32px;border:0;border-radius:6px;background:transparent;color:#655D53;display:inline-flex;align-items:center;justify-content:center;padding:0}
.btn{display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 14px;border-radius:6px;border:1px solid #87837D;background:#FBFAF7;color:#2B2621;font:inherit;font-size:13px;font-weight:500;white-space:nowrap}
.btn.primary{background:#563E84;border-color:#563E84;color:#F7F4ED}
.av{width:36px;height:36px;border-radius:6px;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.row{height:60px;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:0 10px;text-decoration:none;color:#2B2621}
.nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;font-size:13px}
.pv{font-size:12px;color:#655D53;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me{background:#E0DBDE;padding:9px 12px;border-radius:8px;max-width:80%}
.ai{background:#FBFAF7;padding:9px 12px;border-radius:8px;max-width:80%;border:1px solid #DFDBD5}
</style>
</helmet>
<div class="root" style="width: 768px; height: 1024px; overflow: hidden; display: flex; background: #F7F4ED">
  <div style="flex: 0 0 64px; background: #E4DDDA; overflow: hidden">
    <dc-import name="Nav" active="chat" inbox-count="3" hint-size="64px,1024px"></dc-import>
  </div>

  <aside aria-label="会话列表" style="flex: 0 0 240px; background: #F2EDE2; border-right: 1px solid #DFDBD5; display: flex; flex-direction: column">
    <div style="height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 10px; border-bottom: 1px solid #DFDBD5">
      <span style="flex: 1; height: 28px; border-radius: 6px; background: #E4DDDA; display: flex; align-items: center; padding: 0 8px; font-size: 12px; color: #655D53">搜索</span>
      <button class="ib" aria-label="新建" style="background: #E4DDDA; color: #2B2621; width: 28px; height: 28px">+</button>
    </div>
    <a class="row" href="Main.dc.html" style="background: #E4DDDA; box-shadow: inset 2px 0 0 #563E84"><span class="av" style="background: #563E84; color: #F7F4ED">AI</span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span class="nm">LinX 助手</span><span class="pv" style="color: #563E84"># 志愿者排班方案 · 等你决定</span></span></a>
    <a class="row" href="GroupChat.dc.html"><span class="av" style="background: #E0DBDE">书</span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span class="nm">书店活动组</span><span class="pv">周禾：签到表放共享盘了</span></span></a>
    <a class="row" href="People.dc.html"><span class="av" style="background: #E0DBDE">周</span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span class="nm">周禾</span><span class="pv">好，周五对一下报名名单</span></span></a>
    <a class="row" href="PeopleSolid.dc.html"><span class="av" style="background: #563E84; color: #F7F4ED">AI</span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span class="nm">活动小助手</span><span class="pv">海报文案初稿发你了</span></span></a>
    <a class="row" href="GroupChat.dc.html"><span class="av" style="background: #E0DBDE">作</span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span class="nm">作者见面会筹备</span><span class="pv">你：场地确认了，周日下午</span></span></a>
  </aside>

  <main aria-label="内容栏" style="flex: 1; min-width: 0; display: flex; flex-direction: column">
    <header style="height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 14px; border-bottom: 1px solid #DFDBD5">
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25">
        <h1 style="margin: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">LinX 助手</h1>
        <span style="font-size: 12px; color: #655D53"># 志愿者排班方案 ▾</span>
      </div>
      <button class="ib" aria-label="打开聊天信息" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M15 4v16"></path></svg></button>
    </header>
    <div style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; gap: 8px; justify-content: flex-end; align-items: flex-start">
        <div class="me">帮我比较共享日历、排班小程序和自己搭一个表单。</div>
        <span class="av" style="background: #E0DBDE">林</span>
      </div>
      <div style="display: flex; gap: 8px; align-items: flex-start">
        <span class="av" style="background: #563E84; color: #F7F4ED">AI</span>
        <div class="ai">建议先用<strong>共享日历加提醒</strong>：维护最省，志愿者都有日历账号。</div>
      </div>
      <div style="display: flex; gap: 8px; align-items: flex-start">
        <span class="av" style="background: #563E84; color: #F7F4ED">AI</span>
        <div class="ai" style="display: flex; flex-direction: column; gap: 8px"><strong>发送排班日历邀请？</strong><span style="font-size: 13px; color: #655D53">发给 6 位志愿者</span><span style="display: flex; gap: 8px"><span class="btn">拒绝</span><span class="btn primary">批准</span></span></div>
      </div>
      <div style="margin-top: auto; font-size: 12px; color: #655D53; text-align: center">话题在标题下切换；聊天信息从右边浮出（同 1180）</div>
    </div>
    <footer style="border-top: 1px solid #DFDBD5; padding: 10px 12px 14px; display: flex; align-items: flex-end; gap: 8px">
      <label for="m7" style="position: absolute; left: -9999px">消息</label>
      <textarea id="m7" rows="2" style="flex: 1; border: 0; outline: none; resize: none; background: transparent; font: inherit; color: #2B2621"></textarea>
      <button class="btn primary">发送</button>
    </footer>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":768,"height":1024}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
