<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>列表与会话状态</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#F7F4ED}
.root{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif;color:#2B2621;font-size:14px;line-height:1.5}
.cap{font-size:13px;font-weight:600;margin:0 0 8px}
.clip{height:380px;overflow:hidden;border:1px solid #DFDBD5;border-radius:10px}
.frame{height:380px;border:1px solid #DFDBD5;border-radius:10px;overflow:hidden;background:#F7F4ED;display:flex;flex-direction:column}
.hd{height:56px;flex:none;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #DFDBD5;font-weight:600;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 14px;border-radius:6px;border:1px solid #87837D;background:#FBFAF7;color:#2B2621;font:inherit;font-size:13px;font-weight:500;text-decoration:none}
.btn.primary{background:#563E84;border-color:#563E84;color:#F7F4ED}
.muted{color:#655D53}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center}
</style>
</helmet>
<div class="root" style="padding: 28px 32px; box-sizing: border-box; min-height: 900px; display: flex; flex-direction: column; gap: 28px">
  <div>
    <h2 style="margin: 0 0 14px; font-size: 15px; font-weight: 600">左边栏状态</h2>
    <div style="display: flex; gap: 40px; flex-wrap: wrap">
      <div><div class="cap">第一次使用</div><div class="clip" style="width: 280px"><dc-import name="ChatList" variant="empty" selected="none" hint-size="280px,900px"></dc-import></div></div>
      <div><div class="cap">读取中</div><div class="clip" style="width: 280px"><dc-import name="ChatList" variant="loading" selected="none" hint-size="280px,900px"></dc-import></div></div>
      <div><div class="cap">没有网络（显示上次内容）</div><div class="clip" style="width: 280px"><dc-import name="ChatList" variant="offline" selected="volunteer" hint-size="280px,900px"></dc-import></div></div>
      <div><div class="cap">更新失败</div><div class="clip" style="width: 280px"><dc-import name="ChatList" variant="error" selected="volunteer" hint-size="280px,900px"></dc-import></div></div>
    </div>
  </div>

  <div>
    <h2 style="margin: 0 0 14px; font-size: 15px; font-weight: 600">内容栏状态</h2>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px">
      <div>
        <div class="cap">没有选中会话</div>
        <div class="frame">
          <div class="hd"></div>
          <div class="center">
            <div style="font-weight: 500">想做点什么？</div>
            <div class="muted" style="font-size: 12px">直接输入，LinX 助手会开始一项新工作</div>
          </div>
          <div style="border-top: 1px solid #DFDBD5; padding: 12px 16px; display: flex; gap: 8px; align-items: center">
            <span class="muted" style="flex: 1; font-size: 13px">输入要做的事…</span>
            <span class="btn primary">发送</span>
          </div>
        </div>
      </div>
      <div>
        <div class="cap">会话已被删除</div>
        <div class="frame">
          <div class="hd">作者见面会筹备</div>
          <div class="center">
            <div style="font-weight: 500">这个会话已经删除</div>
            <div class="muted" style="font-size: 12px">从收藏或链接打开的旧会话会显示这里</div>
            <a class="btn" href="Main.dc.html">回到会话列表</a>
          </div>
        </div>
      </div>
      <div>
        <div class="cap">没有权限</div>
        <div class="frame">
          <div class="hd">书店活动组</div>
          <div class="center">
            <div style="font-weight: 500">你已不在这个群里</div>
            <div class="muted" style="font-size: 12px">消息内容不再显示。重新被邀请后可以继续查看。</div>
            <a class="btn" href="Main.dc.html">回到会话列表</a>
          </div>
        </div>
      </div>
      <div>
        <div class="cap">没有网络</div>
        <div class="frame">
          <div class="hd">LinX 助手 · # 志愿者排班方案</div>
          <div role="status" style="padding: 8px 16px; background: #E4DDDA; font-size: 12px">没有网络：可以查看和写草稿，恢复后再发送</div>
          <div style="flex: 1"></div>
          <div style="border-top: 1px solid #DFDBD5; padding: 12px 16px; display: flex; gap: 8px; align-items: center">
            <span style="flex: 1; font-size: 13px">共享日历先试两周</span>
            <span class="btn" aria-disabled="true" style="color: #655D53">等待网络</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
