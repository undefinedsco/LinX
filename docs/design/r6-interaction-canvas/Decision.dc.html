<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>会话内审批与输入</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#F7F4ED}
a{color:#563E84;text-underline-offset:3px}a:hover{color:#4B3672}
.root{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif;color:#2B2621;font-size:14px;line-height:1.55}
.ib{width:32px;height:32px;border:0;border-radius:6px;background:transparent;color:#655D53;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.btn{display:inline-flex;align-items:center;justify-content:center;height:32px;padding:0 16px;border-radius:6px;border:1px solid #87837D;background:#FBFAF7;color:#2B2621;font:inherit;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.primary{background:#563E84;border-color:#563E84;color:#F7F4ED}
.av{width:36px;height:36px;border-radius:6px;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.ai{background:#FBFAF7;padding:9px 12px;border-radius:8px;border:1px solid #DFDBD5}
.card{background:#FBFAF7;border-radius:10px;border:1px solid #DFDBD5;width:380px;overflow:hidden}
.ch{padding:14px 14px 4px;font-weight:600;font-size:15px}
.cs{padding:0 14px 12px;font-size:13px;color:#655D53}
.cf{display:flex;gap:8px;padding:10px 14px;border-top:1px solid #DFDBD5}
.disc{display:flex;align-items:center;gap:6px;width:100%;padding:8px 14px;border:0;border-top:1px solid #DFDBD5;background:transparent;font:inherit;font-size:12px;color:#655D53;cursor:pointer;text-align:left}
.sys{align-self:center;font-size:12px;color:#655D53}
.seg{display:flex;padding:2px;background:#E4DDDA;border-radius:8px;margin:0 14px 12px}
.seg label{flex:1;display:flex;align-items:center;justify-content:center;height:28px;border-radius:6px;font-size:13px;cursor:pointer}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.grp{background:#FBFAF7;border-radius:10px;overflow:hidden;margin:0 12px}
.gr{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-bottom:1px solid #DFDBD5;font-size:13px}
.gr:last-child{border-bottom:0}
.gl{padding:16px 24px 6px;font-size:12px;color:#655D53}
.v{color:#655D53}
</style>
</helmet>
<div class="root" style="display: flex; flex-wrap: wrap; min-height: 900px; background: #F7F4ED">
  <div style="flex: 0 0 64px; align-self: stretch; background: #E4DDDA">
    <dc-import name="Nav" active="chat" inbox-count="3" hint-size="64px,900px"></dc-import>
  </div>
  <div style="flex: 0 0 280px; align-self: stretch; background: #F2EDE2">
    <dc-import name="ChatList" selected="volunteer" variant="normal" hint-size="280px,900px"></dc-import>
  </div>

  <main aria-label="内容栏" style="flex: 999 1 480px; min-width: 0; display: flex; flex-direction: column; min-height: 900px">
    <header style="height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 20px; border-bottom: 1px solid #DFDBD5">
      <h1 style="margin: 0; font-size: 15px; font-weight: 600">LinX 助手</h1>
      <span style="flex: 1"></span>
      <button class="ib" aria-label="聊天信息" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M15 4v16"></path></svg></button>
    </header>

    <div style="flex: 1; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px">
      <div class="sys">读取志愿者名单：你已在收件箱批准这一次</div>

      <div style="display: flex; gap: 10px; align-items: flex-start">
        <span class="av" style="background: #563E84; color: #F7F4ED">AI</span>
        <div class="ai">对比表做好了。下面两件事需要你：</div>
      </div>

      <div style="display: flex; gap: 10px; align-items: flex-start">
        <span class="av" style="background: #563E84; color: #F7F4ED">AI</span>
        <section class="card" aria-labelledby="ap-t">
          <div class="ch" id="ap-t">发送排班日历邀请？</div>
          <div class="cs">发给 6 位志愿者，邮件发出后不能撤回</div>
          <button class="disc" aria-expanded="false">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
            详情：收件人、日程、用哪个日历
          </button>
          <div class="cf">
            <button class="btn" style="flex: 1">拒绝</button>
            <button class="btn primary" style="flex: 1">批准这一次</button>
          </div>
          <label style="display: flex; align-items: center; gap: 8px; padding: 0 14px 12px; font-size: 13px"><input type="checkbox" style="accent-color: #563E84">以后这类交给 LinX 判断（授权）</label>
        </section>
      </div>

      <div style="display: flex; gap: 10px; align-items: flex-start">
        <span class="av" style="background: #563E84; color: #F7F4ED">AI</span>
        <section class="card" aria-labelledby="in-t">
          <div class="ch" id="in-t">周日下午几点开始？</div>
          <div class="cs">回答后继续生成排班表</div>
          <fieldset class="seg" style="border: 0">
            <legend style="position: absolute; left: -9999px">开始时间</legend>
            <label><input type="radio" name="t">13:00</label>
            <label style="background: #FBFAF7; font-weight: 600; box-shadow: 0 1px 2px rgb(43 38 33 / .1)"><input type="radio" name="t" checked>14:00</label>
            <label><input type="radio" name="t">其他…</label>
          </fieldset>
          <div class="cf">
            <button class="btn ghost" style="flex: 1; border-color: transparent; color: #655D53">稍后</button>
            <button class="btn primary" style="flex: 1">提交</button>
          </div>
        </section>
      </div>
      <div style="display: flex; gap: 10px; align-items: flex-start">
        <span class="av" style="background: #563E84; color: #F7F4ED">AI</span>
        <section class="card" aria-labelledby="au-t" style="border-style: dashed">
          <div class="ch" id="au-t">读取 去年排班表.pdf</div>
          <div class="cs">你授权过“读你空间里的文件”。把握高，<strong style="font-weight: 600; color: #2B2621">9 分钟后</strong>自动批准</div>
          <div class="cf">
            <button class="btn" style="flex: 1">我来判断</button>
            <button class="btn" style="flex: 1">拒绝</button>
            <button class="btn primary" style="flex: 1">现在批准</button>
          </div>
        </section>
      </div>
    </div>

    <footer style="border-top: 1px solid #DFDBD5; padding: 6px 16px 14px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; gap: 2px; align-items: center">
        <button class="ib" aria-label="添加文件"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"></path></svg></button>
        <button class="ib" aria-label="从文件引用"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2z"></path></svg></button>
        <button class="ib" aria-label="截图"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14M18 22V8a2 2 0 0 0-2-2H2"></path></svg></button>
      </div>
      <label for="d-in" style="position: absolute; left: -9999px">消息</label>
      <textarea id="d-in" rows="2" placeholder="也可以直接打字回答" style="border: 0; outline: none; resize: none; background: transparent; font: inherit; color: #2B2621; padding: 0 4px"></textarea>
      <div style="display: flex; justify-content: flex-end"><button class="btn primary" style="height: 30px; padding: 0 14px">发送</button></div>
    </footer>
  </main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
