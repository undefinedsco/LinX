<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>第一次打开</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#F7F4ED}
a{color:#563E84;text-underline-offset:3px}a:hover{color:#4B3672}
.root{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif;color:#2B2621;font-size:14px;line-height:1.6}
.ib{width:32px;height:32px;border:0;border-radius:6px;background:transparent;color:#655D53;display:inline-flex;align-items:center;justify-content:center;padding:0}
.btn{display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 14px;border-radius:6px;border:1px solid #87837D;background:#FBFAF7;color:#2B2621;font:inherit;font-size:13px;font-weight:500;white-space:nowrap;text-decoration:none;line-height:1}
.btn.primary{background:#563E84;border-color:#563E84;color:#F7F4ED}
.av{width:36px;height:36px;border-radius:6px;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:#563E84;color:#F7F4ED}
.ai{background:#FBFAF7;padding:10px 14px;border-radius:8px;border:1px solid #DFDBD5}
.msg{display:flex;gap:10px;align-items:flex-start}
.sys{align-self:center;font-size:12px;color:#655D53}
.cap{display:flex;gap:10px;align-items:flex-start;padding:4px 0}
.dot{width:6px;height:6px;border-radius:50%;background:#563E84;margin-top:9px;flex:none}
.v{color:#655D53;font-size:12px}
</style>
</helmet>
<div class="root" style="display: flex; flex-wrap: wrap; min-height: 900px; background: #F7F4ED">
  <div style="flex: 0 0 64px; align-self: stretch; background: #E4DDDA">
    <dc-import name="Nav" active="chat" inbox-count="0" hint-size="64px,900px"></dc-import>
  </div>
  <div style="flex: 0 0 280px; align-self: stretch; background: #F2EDE2">
    <dc-import name="ChatList" selected="volunteer" variant="empty" hint-size="280px,900px"></dc-import>
  </div>

  <main aria-label="内容栏" style="flex: 999 1 480px; min-width: 0; display: flex; flex-direction: column; min-height: 900px">
    <header style="height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 20px; border-bottom: 1px solid #DFDBD5">
      <h1 style="margin: 0; font-size: 15px; font-weight: 600">LinX 助手</h1>
      <span style="flex: 1"></span>
      <button class="ib" aria-label="聊天信息" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M15 4v16"></path></svg></button>
    </header>

    <div style="flex: 1; padding: 24px; display: flex; flex-direction: column; gap: 14px">
      <div class="sys">你的空间已经准备好，LinX 助手也在了</div>
      <div class="msg">
        <span class="av">AI</span>
        <div class="ai" style="max-width: 560px">
          你好，我是你的助手。我能帮你：
          <div class="cap"><span class="dot" aria-hidden="true"></span><span><strong style="font-weight: 600">把事做完</strong>：比较方案、整理名单、写文档，做完把文件发给你</span></div>
          <div class="cap"><span class="dot" aria-hidden="true"></span><span><strong style="font-weight: 600">记住你的做法</strong>：你改过我的结果，可以让我记下来，以后照着做</span></div>
          <div class="cap"><span class="dot" aria-hidden="true"></span><span><strong style="font-weight: 600">按时帮你</strong>：比如每周一提醒大家排班</span></div>
          <div class="cap"><span class="dot" aria-hidden="true"></span><span><strong style="font-weight: 600">和朋友一起</strong>：把我拉进群，群里谁都能叫我</span></div>
          <div class="v" style="margin-top: 6px; font-size: 13px">你的聊天、文件和我记下的东西，都存在你自己的空间里。</div>
        </div>
      </div>
      <div class="msg">
        <span class="av">AI</span>
        <div class="ai" style="width: 360px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; border-color: #563E84">
          <label for="nm" style="font-weight: 600">先给我起个名字吧</label>
          <input id="nm" placeholder="比如：小舟" style="height: 34px; border: 1px solid #87837D; border-radius: 6px; background: #F7F4ED; padding: 0 10px; font: inherit">
          <div style="display: flex; justify-content: flex-end; gap: 8px"><span class="btn">就叫 LinX 助手</span><span class="btn primary">好</span></div>
          <div class="v">以后在聊天信息里也能改，改名不会丢聊天记录</div>
        </div>
      </div>
    </div>

    <footer style="border-top: 1px solid #DFDBD5; padding: 6px 16px 14px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; gap: 2px; align-items: center">
        <button class="ib" aria-label="添加文件"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"></path></svg></button>
        <button class="ib" aria-label="从文件引用"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2z"></path></svg></button>
        <button class="ib" aria-label="截图"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14M18 22V8a2 2 0 0 0-2-2H2"></path></svg></button>
      </div>
      <label for="wl-in" style="position: absolute; left: -9999px">消息</label>
      <textarea id="wl-in" rows="2" placeholder="也可以直接说要做的事…" style="border: 0; outline: none; resize: none; background: transparent; font: inherit; color: #2B2621; padding: 0 4px"></textarea>
      <div style="display: flex; justify-content: flex-end"><button class="btn primary">发送</button></div>
    </footer>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
