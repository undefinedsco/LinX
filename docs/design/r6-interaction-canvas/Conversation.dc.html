<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AI 工作会话</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#F7F4ED}
a{color:#563E84;text-underline-offset:3px}a:hover{color:#4B3672}
.root{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif;color:#2B2621;font-size:14px;line-height:1.55}
.ib{width:32px;height:32px;border:0;border-radius:6px;background:transparent;color:#655D53;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.btn{display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 14px;border-radius:6px;border:1px solid #87837D;background:#FBFAF7;color:#2B2621;font:inherit;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.primary{background:#563E84;border-color:#563E84;color:#F7F4ED}
.av{width:36px;height:36px;border-radius:6px;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.me{background:#E0DBDE;padding:9px 12px;border-radius:8px;max-width:68%}
.ai{background:#FBFAF7;padding:9px 12px;border-radius:8px;border:1px solid #DFDBD5}
.sys{align-self:center;font-size:12px;color:#655D53}
.grp{background:#FBFAF7;border-radius:10px;overflow:hidden;margin:0 12px}
.gr{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-bottom:1px solid #DFDBD5;font-size:13px;text-decoration:none;color:#2B2621}
.gr:last-child{border-bottom:0}
.gl{padding:16px 24px 6px;font-size:12px;color:#655D53}
.v{color:#655D53}
.chev{color:#87837D}
.att{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:6px;background:#F2EDE2;font-size:12px}
.steps{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-top:1px solid #DFDBD5;font-size:13px}
.s{display:flex;align-items:center;gap:8px}
</style>
</helmet>
<div class="root" style="display: flex; flex-wrap: wrap; min-height: 900px; background: #F7F4ED">
  <div style="flex: 0 0 64px; align-self: stretch; background: #E4DDDA">
    <dc-import name="Nav" active="chat" inbox-count="3" hint-size="64px,900px"></dc-import>
  </div>
  <div style="flex: 0 0 280px; align-self: stretch; background: #F2EDE2">
    <dc-import name="ChatList" selected="volunteer" variant="normal" hint-size="280px,900px"></dc-import>
  </div>

  <main aria-label="内容栏" style="flex: 999 1 480px; min-width: 0; display: flex; flex-direction: column; min-height: 900px">
    <header style="height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 20px; border-bottom: 1px solid #DFDBD5">
      <h1 style="margin: 0; font-size: 15px; font-weight: 600">LinX 助手</h1>
      <button aria-haspopup="listbox" style="display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 8px; border: 0; border-radius: 6px; background: #E9E4E4; font: inherit; font-size: 12px; color: #2B2621">
        # 志愿者排班方案
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
      <span style="flex: 1"></span>
      <button class="ib" aria-label="聊天信息" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M15 4v16"></path></svg>
      </button>
    </header>

    <div style="flex: 1; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; gap: 10px; justify-content: flex-end; align-items: flex-start">
        <div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-end; max-width: 68%">
          <div class="me" style="max-width: none">下周开始志愿者要排班：每周 6 个人，周六、周日各两个时段。帮我比较共享日历、排班小程序和自己搭一个表单。</div>
          <span class="att">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path></svg>
            志愿者名单.xlsx
          </span>
        </div>
        <span class="av" style="background: #E0DBDE">林</span>
      </div>

      <div style="display: flex; gap: 10px; align-items: flex-start">
        <span class="av" style="background: #563E84; color: #F7F4ED">AI</span>
        <div style="display: flex; flex-direction: column; gap: 6px; max-width: 68%; min-width: 320px">
          <div class="ai" style="padding: 0; overflow: hidden">
            <button aria-expanded="true" style="width: 100%; display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 0; background: transparent; font: inherit; font-size: 13px; color: #2B2621; cursor: pointer; text-align: left">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#563E84" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.2-8.6"></path></svg>
              <span style="flex: 1">正在对比三种工具</span>
              <span class="v" style="font-size: 12px">第 2 步，共 3 步</span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#655D53" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg>
            </button>
            <div class="steps">
              <div class="s"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2B2621" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>读了志愿者名单（6 人）</div>
              <div class="s"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2B2621" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>参考了你的卡片“维护成本”</div>
              <div class="s" style="font-weight: 500"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#563E84" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle></svg>对比维护负担和上手成本</div>
              <div class="s v"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#87837D" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle></svg>整理成对比表</div>
              <a href="Conversation.dc.html" style="font-size: 12px; color: #655D53">查看详细记录</a>
            </div>
          </div>
          <div class="ai">按你们“2 个人维护、低频活动”的情况，<strong>共享日历加提醒</strong>最省事。排班小程序要另装应用；自建表单要长期维护。</div>
          <a href="Card.dc.html" style="font-size: 12px; color: #655D53; text-decoration: none">依据：维护成本 ›</a>
        </div>
      </div>
    </div>

    <footer style="border-top: 1px solid #DFDBD5; padding: 6px 16px 14px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; gap: 2px; align-items: center">
        <button class="ib" aria-label="添加文件"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"></path></svg></button>
        <button class="ib" aria-label="从文件引用"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2z"></path></svg></button>
        <button class="ib" aria-label="截图"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14M18 22V8a2 2 0 0 0-2-2H2"></path></svg></button>
        <span style="flex: 1"></span>
        <button class="btn" style="height: 26px; padding: 0 10px; font-size: 12px">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
          停止
        </button>
      </div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <span class="att">去年排班表.pdf · 打不开 <button style="border: 0; background: transparent; padding: 0; font: inherit; font-size: 12px; color: #563E84; font-weight: 600; cursor: pointer">重试</button> <button aria-label="移除 去年排班表.pdf" style="border: 0; background: transparent; padding: 0; color: #655D53; cursor: pointer">×</button></span>
        <span class="att">日历截图.png · 读取中</span>
      </div>
      <label for="cv-in" style="position: absolute; left: -9999px">消息</label>
      <textarea id="cv-in" rows="2" placeholder="补充说明…" style="border: 0; outline: none; resize: none; background: transparent; font: inherit; color: #2B2621; padding: 0 4px"></textarea>
      <div style="display: flex; justify-content: flex-end"><button class="btn primary">发送</button></div>
    </footer>
  </main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
