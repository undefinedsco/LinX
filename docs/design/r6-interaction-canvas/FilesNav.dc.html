<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>文件左边栏</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<aside aria-label="文件左边栏" style="width: 280px; min-height: 900px; box-sizing: border-box; background: #F2EDE2; border-right: 1px solid #DFDBD5; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', sans-serif; color: #2B2621; font-size: 13px; line-height: 1.4">
  <div style="height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid #DFDBD5">
    <a href="SearchScope.dc.html" style="flex: 1; display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 6px; background: #E4DDDA; color: #655D53; font-size: 12px; text-decoration: none">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      搜索文件、卡片和内容
    </a>
    <a href="LibraryStates.dc.html" aria-label="新建或上传" style="width: 28px; height: 28px; border-radius: 6px; background: #E4DDDA; display: inline-flex; align-items: center; justify-content: center; color: #2B2621">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
  </div>
  <nav aria-label="文件夹" style="padding: 8px 6px; display: flex; flex-direction: column; gap: 1px">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="14">
      <sc-if value="{{it.isHead}}" hint-placeholder-val="{{ false }}">
        <div style="padding: 12px 8px 4px; font-size: 11px; font-weight: 600; color: #655D53">{{it.label}}</div>
      </sc-if>
      <sc-if value="{{it.isLink}}" hint-placeholder-val="{{ true }}">
        <a href="{{it.href}}" aria-current="{{it.cur}}" style="{{it.style}}">
          <span style="width: 12px; flex: none; color: #87837D; font-size: 10px; text-align: center">{{it.chev}}</span>
          <sc-if value="{{it.isFolder}}" hint-placeholder-val="{{ true }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#655D53" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2z"></path></svg></sc-if>
          <sc-if value="{{it.isDoc}}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#655D53" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path></svg></sc-if>
          <sc-if value="{{it.isData}}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#563E84" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 10h18M9 4v16"></path></svg></sc-if>
          <sc-if value="{{it.isVocab}}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#563E84" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"></path></svg></sc-if>
          <span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.label}}</span>
          <span style="font-size: 11px; color: #655D53">{{it.note}}</span>
        </a>
      </sc-if>
    </sc-for>
  </nav>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"selected":{"editor":"enum","options":["root","f1","doc","pdf","f2","cards","plan","f3","vocabdir","vocab","classes","ns","f4","all","fromchat","board1","board2","tag1","tag2","tag3","none"],"default":"f1"},"$preview":{"width":280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const legacy = { all: 'cards', fromchat: 'cards', inbox: 'cards', board1: 'plan', board2: 'plan', tag1: 'f2', tag2: 'f2', tag3: 'f2', doc: 'f1', pdf: 'f1' };
    const raw = this.props.selected ?? 'f1';
    const sel = legacy[raw] || raw;
    const base = 'display: flex; align-items: center; gap: 6px; height: 28px; border-radius: 6px; text-decoration: none; color: #2B2621; padding-right: 8px; ';
    const head = (label) => ({ isHead: true, isLink: false, label });
    const node = (id, kind, label, href, depth, chev, note) => ({
      isHead: false, isLink: true, label, href, note: note || '', chev: chev || '',
      isFolder: kind === 'folder', isDoc: kind === 'doc', isData: kind === 'data', isVocab: kind === 'vocab',
      cur: id === sel ? 'page' : 'false',
      style: base + 'padding-left: ' + (6 + depth * 16) + 'px; ' + (id === sel ? 'background: #E4DDDA; font-weight: 600; box-shadow: inset 2px 0 0 #563E84;' : ''),
    });
    return {
      items: [
        head('我的空间'),
        node('f1', 'folder', '活动', 'Library.dc.html', 0, '▾'),
        node('photos', 'folder', '活动照片', 'Library.dc.html', 1, '▸'),
        node('plan', 'data', '志愿者排班', 'Board.dc.html', 1),
        node('f2', 'data', '志愿者', 'TagTable.dc.html', 0, '', '12'),
        node('aidir', 'folder', 'LinX 助手', 'Grants.dc.html', 0, '▾'),
        node('grants', 'data', '授权', 'Grants.dc.html', 1, '', '4'),
        node('cards', 'data', '记住的', 'Card.dc.html', 1, '', '12'),
        node('f3', 'folder', '聊天文件', 'Library.dc.html', 0, '▸'),
        node('vocabdir', 'folder', '词表', 'Vocab.dc.html', 0, '▾'),
        node('vocab', 'data', '属性', 'Vocab.dc.html', 1, '', '23'),
        node('classes', 'data', '类型', 'Vocab.dc.html', 1, '', '6'),
        node('ns', 'data', '命名空间', 'Vocab.dc.html', 1, '', '4'),
        head('共享给我'),
        node('f4', 'folder', '周禾 · 书店年度', 'LibraryStates.dc.html', 0, '▸'),
      ],
    };
  }
}
</script>
</body>
</html>
