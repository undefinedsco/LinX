<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>纠正与留下判断</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#F7F4ED}
a{color:#563E84;text-underline-offset:3px}a:hover{color:#4B3672}
.root{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif;color:#2B2621;font-size:14px;line-height:1.55}
.ib{width:32px;height:32px;border:0;border-radius:6px;background:transparent;color:#655D53;display:inline-flex;align-items:center;justify-content:center;padding:0}
.btn{display:inline-flex;align-items:center;justify-content:center;height:28px;padding:0 12px;border-radius:6px;border:1px solid #87837D;background:#FBFAF7;color:#2B2621;font:inherit;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn.primary{background:#563E84;border-color:#563E84;color:#F7F4ED}
.av{width:36px;height:36px;border-radius:6px;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.me{background:#E0DBDE;padding:9px 12px;border-radius:8px;max-width:68%}
.ai{background:#FBFAF7;padding:9px 12px;border-radius:8px;border:1px solid #DFDBD5}
.sys{align-self:center;font-size:12px;color:#655D53}
.grp{background:#FBFAF7;border-radius:10px;overflow:hidden;margin:0 12px}
.gr{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-bottom:1px solid #DFDBD5;font-size:13px;text-decoration:none;color:#2B2621}
.gr:last-child{border-bottom:0}
.gl{padding:16px 24px 6px;font-size:12px;color:#655D53}
.v{color:#655D53}
.chev{color:#87837D}
del{color:#655D53}
ins{text-decoration:none;font-weight:600}
</style>
</helmet>
<div class="root" style="display: flex; flex-wrap: wrap; min-height: 900px; background: #F7F4ED">
  <div style="flex: 0 0 64px; align-self: stretch; background: #E4DDDA">
    <dc-import name="Nav" active="chat" inbox-count="3" hint-size="64px,900px"></dc-import>
  </div>
  <div style="flex: 0 0 280px; align-self: stretch; background: #F2EDE2">
    <dc-import name="ChatList" selected="volunteer" variant="normal" hint-size="280px,900px"></dc-import>
  </div>

  <main aria-label="内容栏" style="flex: 999 1 480px; min-width: 0; display: flex; flex-direction: column; min-height: 900px">
    <header style="height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 20px; border-bottom: 1px solid #DFDBD5">
      <h1 style="margin: 0; font-size: 15px; font-weight: 600">LinX 助手</h1>
      <span style="display: inline-flex; align-items: center; height: 26px; padding: 0 8px; border-radius: 6px; background: #E9E4E4; font-size: 12px"># 排班规则 ▾</span>
      <span style="flex: 1"></span>
      <button class="ib" aria-label="聊天信息" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M15 4v16"></path></svg></button>
    </header>

    <div style="flex: 1; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; gap: 10px; align-items: flex-start">
        <span class="av" style="background: #563E84; color: #F7F4ED">AI</span>
        <div class="ai" style="max-width: 68%">
          排班规则：
          <ol style="margin: 4px 0 0; padding-left: 20px">
            <li>每个时段 3 人，至少 1 人有活动经验</li>
            <li>每人每月<del>至少 2 次</del> <ins>最多 2 次，不设最低次数</ins></li>
            <li>请假提前 24 小时在群里说</li>
          </ol>
        </div>
      </div>

      <div style="display: flex; gap: 10px; justify-content: flex-end; align-items: flex-start">
        <div class="me">第 2 条改一下：志愿者是自愿来的，不能给压力，只设上限。</div>
        <span class="av" style="background: #E0DBDE">林</span>
      </div>

      <div class="sys">已按你的意思改好第 2 条</div>

      <div style="display: flex; gap: 10px; align-items: flex-start">
        <span class="av" style="background: #563E84; color: #F7F4ED">AI</span>
        <div style="display: flex; flex-direction: column; gap: 6px; max-width: 68%">
          <div role="toolbar" aria-label="对这条消息" style="align-self: flex-start; display: flex; gap: 2px; padding: 3px; border-radius: 8px; background: #FBFAF7; border: 1px solid #DFDBD5; box-shadow: 0 4px 12px rgb(43 38 33 / .08)">
            <button class="ib" style="width: auto; height: 26px; padding: 0 8px; font-size: 12px">复制</button>
            <button class="ib" style="width: auto; height: 26px; padding: 0 8px; font-size: 12px; background: #E4DDDA; color: #2B2621; font-weight: 600">记住</button>
            <button class="ib" style="width: auto; height: 26px; padding: 0 8px; font-size: 12px">收藏</button>
            <button class="ib" style="width: auto; height: 26px; padding: 0 8px; font-size: 12px" aria-label="更多">⋯</button>
          </div>
          <div class="ai">好，第 2 条改成：每人每月最多 2 次，不设最低次数。</div>
        </div>
      </div>
      <div class="sys">什么都不会弹出来。想让 LinX 以后都这样，在消息上点“记住”</div>
    </div>

    <footer style="border-top: 1px solid #DFDBD5; padding: 6px 16px 14px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; gap: 2px; align-items: center">
        <button class="ib" aria-label="添加文件"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"></path></svg></button>
        <button class="ib" aria-label="从文件引用"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2z"></path></svg></button>
        <button class="ib" aria-label="截图"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14M18 22V8a2 2 0 0 0-2-2H2"></path></svg></button>
      </div>
      <label for="c-in" style="position: absolute; left: -9999px">消息</label>
      <textarea id="c-in" rows="2" placeholder="继续修改…" style="border: 0; outline: none; resize: none; background: transparent; font: inherit; color: #2B2621; padding: 0 4px"></textarea>
      <div style="display: flex; justify-content: flex-end"><button class="btn primary" style="height: 30px; padding: 0 14px; border-radius: 6px">发送</button></div>
    </footer>
  </main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
