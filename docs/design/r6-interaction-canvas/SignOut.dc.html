<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>退出登录</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#F7F4ED}
a{color:#563E84;text-underline-offset:3px}
.root{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif;color:#2B2621;font-size:14px;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;height:32px;padding:0 14px;border-radius:6px;border:1px solid #87837D;background:#FBFAF7;color:#2B2621;font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.btn.primary{background:#563E84;border-color:#563E84;color:#F7F4ED}
.muted{color:#655D53}
.line{display:flex;gap:8px;align-items:flex-start;font-size:13px;text-align:left}
</style>
</helmet>
<div class="root" style="display: flex; flex-wrap: wrap; min-height: 900px; background: #F7F4ED; position: relative">
  <div style="flex: 0 0 64px; align-self: stretch; background: #E4DDDA">
    <dc-import name="Nav" active="chat" inbox-count="3" hint-size="64px,900px"></dc-import>
  </div>
  <div style="flex: 0 0 280px; align-self: stretch; background: #F2EDE2">
    <dc-import name="ChatList" selected="volunteer" variant="normal" hint-size="280px,900px"></dc-import>
  </div>
  <div aria-hidden="true" style="flex: 999 1 480px; min-width: 0; min-height: 900px">
    <div style="height: 56px; border-bottom: 1px solid #DFDBD5"></div>
  </div>
  <div aria-hidden="true" style="flex: 0 0 300px; background: #F2EDE2; border-left: 1px solid #DFDBD5"></div>
  <div style="position: absolute; inset: 0; background: rgba(43, 38, 33, 0.22)"></div>

  <div role="alertdialog" aria-labelledby="so-t" style="position: absolute; left: 50%; top: 220px; transform: translateX(-50%); width: min(380px, calc(100% - 32px)); background: #FBFAF7; border-radius: 14px; box-shadow: 0 8px 24px rgb(43 38 33 / .14); padding: 22px 20px 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; text-align: center">
    <div id="so-t" style="font-size: 16px; font-weight: 600">退出登录？</div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 4px">
      <div class="line">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#655D53" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: 2px; flex: none"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
        <span>2 条没发出的草稿会留在这台电脑，只有你登录后能看到</span>
      </div>
      <div class="line">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#655D53" stroke-width="1.75" stroke-linecap="round" aria-hidden="true" style="margin-top: 2px; flex: none"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        <span>“每周排班提醒”还在运行，退出后会继续 · <a href="Tasks.dc.html">查看</a></span>
      </div>
    </div>
    <div style="display: flex; gap: 8px; margin-top: 4px">
      <button class="btn" style="flex: 1">取消</button>
      <button class="btn primary" style="flex: 1">退出登录</button>
    </div>
    <button style="border: 0; background: transparent; font: inherit; font-size: 12px; color: #655D53; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">放弃草稿并退出</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
