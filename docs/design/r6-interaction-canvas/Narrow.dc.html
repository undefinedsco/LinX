.muted{color:#655D53}
.small{font-size:12px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:56px;text-decoration:none;color:#655D53;font-size:11px}

      <div style="display: flex; flex-direction: column; gap: 4px; max-width: 75%">
        <div style="background: #FBFAF7; border: 1px solid #DFDBD5; padding: 9px 12px; border-radius: 8px; font-size: 14px">建议先用<strong>共享日历加提醒</strong>：维护最省，志愿者都有日历账号。</div>

      <span style="width: 34px; height: 34px; border-radius: 6px; background: #563E84; color: #F7F4ED; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex: none">AI</span>

        <div style="font-weight: 600; font-size: 14px">发送排班日历邀请？</div>
        <div class="small muted">发给 6 位志愿者</div>
        <a class="btn primary" href="Decision.dc.html" style="height: 40px">查看并决定</a>

  <footer style="padding: 8px 12px; border-top: 1px solid #DFDBD5; background: #F7F4ED">
    <div style="display: flex; align-items: flex-end; gap: 8px; border: 1px solid #87837D; border-radius: 10px; background: #FBFAF7; padding: 6px 6px 6px 12px">
      <label for="nm" style="position: absolute; left: -9999px">消息</label>
      <textarea id="nm" rows="1" style="flex: 1; border: 0; outline: none; resize: none; background: transparent; font: inherit; font-size: 14px; padding: 8px 0; color: #2B2621">共享日历先试两周</textarea>
      <button class="btn primary" style="height: 36px; padding: 0 12px">发送</button>
    </div>
  </footer>

  <nav aria-label="主导航" style="display: flex; border-top: 1px solid #DFDBD5; background: #F2EDE2">
    <a class="tab" href="Main.dc.html" aria-current="page" style="color: #563E84; font-weight: 600; box-shadow: inset 0 3px 0 #563E84">

    <a class="tab" href="Library.dc.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2z"></path></svg>
