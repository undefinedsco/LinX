<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>文件里的搜索</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#F7F4ED}
a{color:#563E84;text-underline-offset:3px}a:hover{color:#4B3672}
.root{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif;color:#2B2621;font-size:14px;line-height:1.5}
.ib{width:32px;height:32px;border:0;border-radius:6px;background:transparent;color:#655D53;display:inline-flex;align-items:center;justify-content:center;padding:0}
.res{display:flex;gap:12px;padding:12px 20px;border-bottom:1px solid #DFDBD5;text-decoration:none;color:#2B2621}
.res:hover{background:#E9E4E4}
.s{font-size:12px;color:#655D53}
mark{background:transparent;color:#563E84;font-weight:600}
.gl{padding:16px 24px 6px;font-size:12px;color:#655D53}
.grp{background:#FBFAF7;border-radius:10px;overflow:hidden;margin:0 12px}
.gr{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-bottom:1px solid #DFDBD5;font-size:13px;text-decoration:none;color:#2B2621}
.gr:last-child{border-bottom:0}
.v{color:#655D53}
.chev{color:#87837D}
.btn{display:inline-flex;align-items:center;justify-content:center;height:26px;padding:0 10px;border-radius:6px;border:1px solid #87837D;background:#FBFAF7;color:#2B2621;font:inherit;font-size:12px;font-weight:500;text-decoration:none;white-space:nowrap}
</style>
</helmet>
<div class="root" style="display: flex; flex-wrap: wrap; min-height: 900px; background: #F7F4ED">
  <div style="flex: 0 0 64px; align-self: stretch; background: #E4DDDA">
    <dc-import name="Nav" active="files" inbox-count="3" hint-size="64px,900px"></dc-import>
  </div>
  <div style="flex: 0 0 280px; align-self: stretch; background: #F2EDE2">
    <dc-import name="FilesNav" selected="none" hint-size="280px,900px"></dc-import>
  </div>

  <main aria-label="内容栏：搜索结果" style="flex: 999 1 480px; min-width: 0; display: flex; flex-direction: column; min-height: 900px">
    <header style="height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 20px; border-bottom: 1px solid #DFDBD5">
      <div style="flex: 1; display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 6px; background: #FBFAF7; box-shadow: inset 0 0 0 1px #563E84; max-width: 420px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#655D53" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <label for="sq" style="position: absolute; left: -9999px">搜索</label>
        <input id="sq" value="排班" style="flex: 1; border: 0; outline: none; background: transparent; font: inherit; font-size: 13px">
      </div>
      <button aria-haspopup="menu" style="height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: #E9E4E4; font: inherit; font-size: 12px">范围：我的空间 ▾</button>
      <span style="flex: 1"></span>
    </header>
    <div role="status" style="padding: 8px 20px; font-size: 12px; color: #655D53; border-bottom: 1px solid #DFDBD5; background: #F2EDE2">文件正文还在建立索引，部分文件只按标题搜索</div>

    <div>
      <a class="res" href="Card.dc.html" style="background: #E4DDDA; box-shadow: inset 2px 0 0 #563E84">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#563E84" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: 3px; flex: none"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
        <span style="flex: 1; min-width: 0"><span style="font-weight: 500">志愿者<mark>排班</mark>不设最低次数</span> <span class="s">· 卡片</span><br><span class="s">给志愿者<mark>排班</mark>时只设每月上限……</span></span>
      </a>
      <a class="res" href="Card.dc.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#655D53" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: 3px; flex: none"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
        <span style="flex: 1; min-width: 0"><span style="font-weight: 500">维护成本</span> <span class="s">· 已确认卡片</span><br><span class="s">用过它的工作：志愿者<mark>排班</mark>方案</span></span>
      </a>
      <a class="res" href="Board.dc.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#655D53" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: 3px; flex: none"><rect x="3" y="3" width="18" height="18" rx="2"></rect><rect x="7" y="7" width="4" height="4"></rect><rect x="13" y="13" width="4" height="4"></rect></svg>
        <span style="flex: 1; min-width: 0"><span style="font-weight: 500">志愿者<mark>排班</mark></span> <span class="s">· 表格（有白板视图）</span><br><span class="s">5 张卡片</span></span>
      </a>
      <a class="res" href="Source.dc.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#655D53" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: 3px; flex: none"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path></svg>
        <span style="flex: 1; min-width: 0"><span style="font-weight: 500">讲座录音.m4a</span> <span class="s">· 12:05</span><br><span class="s">“下周的志愿者<mark>排班</mark>先按上个月的来”</span></span>
      </a>
      <a class="res" href="Library.dc.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#655D53" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: 3px; flex: none"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path></svg>
        <span style="flex: 1; min-width: 0"><span style="font-weight: 500">志愿者<mark>排班</mark>表.xlsx</span> <span class="s">· 活动</span><br><span class="s">只匹配了标题</span></span>
      </a>
      <div style="padding: 12px 20px; display: flex; flex-direction: column; gap: 6px">
        <div class="s">另有 2 个结果你没有权限查看，没有显示内容</div>
        <div class="s" style="display: flex; gap: 8px; align-items: center">共享给我的空间没有搜索 <a class="btn" href="SearchStates.dc.html">也搜共享给我的</a></div>
      </div>
    </div>
  </main>

  <aside aria-label="右边栏：预览" style="flex: 0 0 300px; box-sizing: border-box; background: #F2EDE2; border-left: 1px solid #DFDBD5; min-height: 900px">
    <div style="height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid #DFDBD5"><span style="font-weight: 600; flex: 1; font-size: 14px">志愿者排班不设最低次数</span></div>
    <div style="padding: 16px 24px 4px; font-size: 14px">给志愿者排班时只设每月上限，不设最低次数。</div>
    <div class="gl">为什么匹配</div>
    <div style="padding: 0 24px; font-size: 13px">标题和正文都包含“排班”</div>
    <div class="gl">状态</div>
    <div class="grp">
      <div class="gr"><span style="flex: 1">已确认</span><span class="v">今天 · 来自聊天</span></div>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
