<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>持续任务</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#F7F4ED}
a{color:#563E84;text-underline-offset:3px}a:hover{color:#4B3672}
.root{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif;color:#2B2621;font-size:14px;line-height:1.55}
.ib{width:32px;height:32px;border:0;border-radius:6px;background:transparent;color:#655D53;display:inline-flex;align-items:center;justify-content:center;padding:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 12px;border-radius:6px;border:1px solid #87837D;background:#FBFAF7;color:#2B2621;font:inherit;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.av{width:36px;height:36px;border-radius:6px;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.ai{background:#FBFAF7;padding:9px 12px;border-radius:8px;border:1px solid #DFDBD5}
.sys{align-self:center;font-size:12px;color:#655D53}
.grp{background:#FBFAF7;border-radius:10px;overflow:hidden;margin:0 12px}
.gr{display:flex;align-items:center;gap:8px;min-height:42px;padding:0 12px;border-bottom:1px solid #DFDBD5;font-size:13px;text-decoration:none;color:#2B2621}
.gr:last-child{border-bottom:0}
.gl{padding:16px 24px 6px;font-size:12px;color:#655D53}
.v{color:#655D53}
.chev{color:#87837D}
</style>
</helmet>
<div class="root" style="display: flex; flex-wrap: wrap; min-height: 900px; background: #F7F4ED">
  <div style="flex: 0 0 64px; align-self: stretch; background: #E4DDDA">
    <dc-import name="Nav" active="chat" inbox-count="3" hint-size="64px,900px"></dc-import>
  </div>
  <div style="flex: 0 0 280px; align-self: stretch; background: #F2EDE2">
    <dc-import name="ChatList" selected="accounts" variant="normal" hint-size="280px,900px"></dc-import>
  </div>

  <main aria-label="内容栏" style="flex: 999 1 480px; min-width: 0; display: flex; flex-direction: column; min-height: 900px">
    <header style="height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 20px; border-bottom: 1px solid #DFDBD5">
      <h1 style="margin: 0; font-size: 15px; font-weight: 600">LinX 助手</h1>
      <span style="display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 999px; background: #E9E4E4; font-size: 12px">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        每周一 9:00
      </span>
      <span style="flex: 1"></span>
      <button class="ib" aria-label="收起详情" aria-expanded="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M15 4v16"></path></svg></button>
    </header>

    <div style="flex: 1; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px">
      <div class="sys">10月6日 周一 9:00 · 完成</div>
      <div style="display: flex; gap: 10px; align-items: flex-start">
        <span class="av" style="background: #563E84; color: #F7F4ED">AI</span>
        <div class="ai" style="max-width: 68%">本周排班已发到书店活动组。周日下午还缺 1 人，已经问了陆川。</div>
      </div>

      <div class="sys">今天 9:00 · 正在运行</div>
      <div style="display: flex; gap: 10px; align-items: flex-start">
        <span class="av" style="background: #563E84; color: #F7F4ED">AI</span>
        <div style="display: flex; flex-direction: column; gap: 6px; min-width: 340px">
          <div class="ai" style="display: flex; align-items: center; gap: 8px">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#563E84" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.2-8.6"></path></svg>
            <span style="flex: 1">正在检查本周空缺</span>
            <span class="v" style="font-size: 12px">第 2 步，共 3 步 ›</span>
          </div>
          <div style="display: flex; gap: 8px">
            <button class="btn">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg>
              停止这一次
            </button>
          </div>
        </div>
      </div>
    </div>

    <footer style="border-top: 1px solid #DFDBD5; padding: 6px 16px 14px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; gap: 2px; align-items: center">
        <button class="ib" aria-label="添加文件"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"></path></svg></button>
        <button class="ib" aria-label="从文件引用"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2z"></path></svg></button>
        <button class="ib" aria-label="截图"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14M18 22V8a2 2 0 0 0-2-2H2"></path></svg></button>
        <span style="flex: 1"></span>
        <button class="btn" style="height: 26px; padding: 0 10px; font-size: 12px"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>停止</button>
      </div>
      <label for="t-in" style="position: absolute; left: -9999px">消息</label>
      <textarea id="t-in" rows="2" placeholder="给这项任务补充说明…" style="border: 0; outline: none; resize: none; background: transparent; font: inherit; color: #2B2621; padding: 0 4px"></textarea>
      <div style="display: flex; justify-content: flex-end"><button class="btn" style="height: 30px; padding: 0 14px; background: #563E84; border-color: #563E84; color: #F7F4ED; font-size: 13px">发送</button></div>
    </footer>
  </main>

  <aside aria-label="右边栏：任务" style="flex: 0 0 300px; box-sizing: border-box; background: #F2EDE2; border-left: 1px solid #DFDBD5; min-height: 900px">
    <div style="height: 56px; box-sizing: border-box; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #DFDBD5; font-weight: 600">详情</div>
    <div class="gl">计划</div>
    <div class="grp">
      <a class="gr" href="TasksStates.dc.html"><span style="flex: 1">重复</span><span class="v">每周一 9:00</span><span class="chev">›</span></a>
      <div class="gr"><span style="flex: 1">下一次</span><span class="v">10月20日 9:00</span></div>
      <div class="gr"><span style="flex: 1">以后自动运行</span><span role="switch" aria-checked="true" aria-label="以后自动运行" style="width: 34px; height: 20px; border-radius: 999px; background: #563E84; position: relative"><span style="position: absolute; right: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #F7F4ED"></span></span></div>
    </div>
    <div style="padding: 6px 24px 0; font-size: 12px; color: #655D53">关掉只影响以后，不会停止正在运行的这次。</div>
    <div class="gl">最近运行</div>
    <div class="grp">
      <div class="gr"><span style="flex: 1">今天 9:00</span><span style="color: #563E84">运行中</span></div>
      <div class="gr"><span style="flex: 1">10月6日</span><span class="v">完成</span></div>
      <div class="gr"><span style="flex: 1">9月29日</span><span class="v">完成</span></div>
      <a class="gr" href="TasksStates.dc.html"><span style="flex: 1">9月22日</span><span class="v">没成功</span><span class="chev">›</span></a>
    </div>
    <div class="gl">这项任务</div>
    <div class="grp">
      <a class="gr" href="Method.dc.html"><span style="flex: 1">方法</span><span class="v">书店日常</span><span class="chev">›</span></a>
      <div class="gr"><span style="flex: 1">会发到</span><span class="v">书店活动组</span></div>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
